name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Java 21 tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Vertex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run test suite
        run: ./mvnw test -q
      - name: Package plugin
        run: ./mvnw package -q -DskipTests
