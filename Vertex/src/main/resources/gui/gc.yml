# The GC wallet menu (/gc). Config-driven the same way gui/events.yml is --
# size/title/items/layout, with {balance} the one placeholder available.
size: 27
title: "<dark_gray>ɢᴄ ᴡᴀʟʟᴇᴛ"

filler:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  balance:
    material: SUNFLOWER
    slot: 13
    name: "<yellow><bold>ɢᴄ ʙᴀʟᴀɴᴄᴇ"
    lore:
      - "<gray>ʏᴏᴜ ʜᴀᴠᴇ <yellow>{balance} ɢᴄ"

  deposit:
    material: LIME_DYE
    slot: 11
    name: "<green><bold>ᴅᴇᴘᴏꜱɪᴛ"
    lore:
      - "<gray>Convert money into GC."
      - "<green>Click to enter an amount on the shared sign."

  withdraw:
    material: RED_DYE
    slot: 15
    name: "<red><bold>ᴡɪᴛʜᴅʀᴀᴡ"
    lore:
      - "<gray>Convert GC back into money."
      - "<red>Click to enter an amount on the shared sign."

  redeem:
    material: PAPER
    slot: 20
    name: "<aqua><bold>ʀᴇᴅᴇᴇᴍ ᴄᴏᴅᴇ"
    lore:
      - "<gray>Type <white>/gc redeem <code><gray> in chat."

  logs:
    material: BOOK
    slot: 24
    name: "<white><bold>ᴛʀᴀɴꜱᴀᴄᴛɪᴏɴ ʟᴏɢꜱ"
    lore:
      - "<gray>View your own GC history."
