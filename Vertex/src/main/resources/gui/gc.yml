# The GC wallet menu (/gc). Config-driven the same way gui/events.yml is --
# size/title/items/layout, with {balance} the one placeholder available.
size: 27
title: "<dark_gray>ɢᴄ ᴡᴀʟʟᴇᴛ"

filler:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  balance:
    material: SUNFLOWER
    slot: 11
    name: "<yellow><bold>ɢᴄ ʙᴀʟᴀɴᴄᴇ"
    lore:
      - "<gray>ʏᴏᴜ ʜᴀᴠᴇ <yellow>{balance} ɢᴄ"

  withdraw:
    material: RED_DYE
    slot: 12
    name: "<red><bold>ᴡɪᴛʜᴅʀᴀᴡ"
    lore:
      - "<gray>Convert GC into a one-time redeem code."
      - "<red>Use <white>/gc withdraw <amount>"

  redeem:
    material: GREEN_DYE
    slot: 13
    name: "<green><bold>ʀᴇᴅᴇᴇᴍ ᴄᴏᴅᴇ"
    lore:
      - "<gray>Type <white>/gc redeem <gray>in chat."

  logs:
    material: BOOK
    slot: 16
    name: "<white><bold>ᴛʀᴀɴꜱᴀᴄᴛɪᴏɴ ʟᴏɢꜱ"
    lore:
      - "<gray>View your own GC history."
