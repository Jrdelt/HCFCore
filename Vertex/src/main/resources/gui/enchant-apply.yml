# Custom Enchantment application GUI. Three open (non-filler) slots take
# real items: the target gear (slot 11), the physical enchant item (slot
# 13, pre-filled with whatever triggered this menu), and any Lucky Gems
# (slot 15). Confirm attempts the application server-side; Cancel or simply
# closing the menu both just hand back whatever is still sitting in those
# three slots -- nothing is ever escrowed away.
size: 27
title: "<dark_purple>ᴇɴᴄʜᴀɴᴛ ᴀᴘᴘʟɪᴄᴀᴛɪᴏɴ"

filler:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  info:
    material: ENCHANTED_BOOK
    slot: 4
    name: "<light_purple>How to enchant"
    lore:
      - "<gray>Place your gear on the left,"
      - "<gray>the enchant item in the middle,"
      - "<gray>and any Lucky Gems on the right."
      - "<gray>Then click Confirm."

  # {chance} is recomputed live every time a slot's contents change.
  chance-display:
    material: PAPER
    slot: 22
    name: "<yellow>Current success chance"
    lore:
      - "<white>{chance}%"

  confirm:
    material: LIME_STAINED_GLASS_PANE
    slot: 20
    name: "<green>ᴄᴏɴꜰɪʀᴍ"
    lore:
      - "<gray>Attempts the application now."
    sound: block.note_block.pling

  cancel:
    material: RED_STAINED_GLASS_PANE
    slot: 24
    name: "<red>ᴄᴀɴᴄᴇʟ"
    lore:
      - "<gray>Closes this menu; your items are returned."
    sound: block.note_block.bass
