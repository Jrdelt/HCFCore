# ============================================
# CUSTOM ENCHANTMENTS -- RUNE TIER POOLS
# ============================================
# Each normal tier has its own five-enchant pool. An enchant ID appears in
# one tier only, so rolling a higher tier never repeats a lower-tier Rune.
# Every table entry is independently weighted; weights do not need to total 100.

