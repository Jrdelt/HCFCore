# Source Buckets -- see docs/source-buckets.md.
#
# Reusable, infinite-use custom buckets that place configured blocks following
# a configured flow pattern. Usable by everyone -- no faction permission,
# no player permission node, no cooldown -- but only inside a valid faction
# claim: never Wilderness, never SafeZone/WarZone (see disabled-claim-names
# below). A variant with base-claim-only: true additionally works only
# inside a Base Claim, never a Raid Claim.
#
# Each variant is bought once from /shop (shop-price) and then stays in the
# owner's inventory forever, unlocking infinite use -- it is never
# consumed. Every successful placement then charges the fixed per-use-fee,
# but ONLY after the placement actually happens; a failed placement or
# insufficient balance places nothing and charges nothing. Each placed block
# type is configured independently below.
#
# flow-pattern is one of:
#   single-source -- places exactly one source block at the placement point.
#   downward      -- places a source on the placement point and on each
#                     valid block straight down from it, up to max-depth
#                     blocks deep, stopping early at any obstruction or
#                     claim boundary (see the class doc on
#                     SourceBucketManager.computeFlowPositions for the
#                     exact stopping rules).
#                     Set max-depth: -1 to continue to the world's minimum Y.
#   outward       -- places a line in the clicked face's direction. It stops
#                     early at any obstruction or claim boundary.
# max-depth is only read for flow-pattern: downward. max-length is only read
# for flow-pattern: outward and counts the placement block as part of the line.

water:
  source:
    enabled: true
    flow-pattern: single-source
    base-claim-only: false
    combat-allowed: false
    shop-price: 2500
    per-use-fee: 5
    material: WATER_BUCKET
    glow: false
    name: "<aqua>Water Source Bucket"
    lore:
      - "<gray>Right-click a block to place a"
      - "<gray>single water source. Reusable --"
      - "<gray>never consumed. Works in any valid"
      - "<gray>faction claim."
  downward:
    enabled: true
    flow-pattern: downward
    max-depth: 8
    base-claim-only: true
    combat-allowed: false
    shop-price: 8000
    per-use-fee: 15
    material: WATER_BUCKET
    # custom-model-data: 2001
    glow: true
    name: "<aqua>Waterfall Bucket"
    lore:
      - "<gray>Right-click a block to drop a"
      - "<gray>column of water sources straight"
      - "<gray>down, up to 8 blocks deep."
      - "<gray>Base Claims only. Reusable."

lava:
  source:
    enabled: true
    flow-pattern: single-source
    base-claim-only: false
    combat-allowed: false
    shop-price: 3000
    per-use-fee: 5
    material: LAVA_BUCKET
    glow: false
    name: "<gold>Lava Source Bucket"
    lore:
      - "<gray>Right-click a block to place a"
      - "<gray>single lava source. Reusable --"
      - "<gray>never consumed. Works in any valid"
      - "<gray>faction claim."
  downward:
    enabled: true
    flow-pattern: downward
    # -1 means continue through every block down to the world's minimum Y,
    # stopping only at the first obstruction. The manager places source blocks
    # directly, so this never creates a falling-lava entity.
    max-depth: -1
    base-claim-only: true
    combat-allowed: false
    shop-price: 9000
    per-use-fee: 20
    material: LAVA_BUCKET
    # custom-model-data: 2002
    glow: true
    name: "<gold>Lava Cascade Bucket"
    lore:
      - "<gray>Right-click a block to drop a"
      - "<gray>column of lava sources straight"
      - "<gray>down to the world bottom or first obstruction."
      - "<gray>Base Claims only. Reusable."

# These solid-block variants are ordinary reusable Source Buckets too. A
# plain BUCKET is used as their default icon so a resource pack can assign a
# custom-model-data value later without changing how the item works.
obsidian:
  downward:
    enabled: true
    flow-pattern: downward
    # -1 means continue until the world's bottom, an obstruction, or a claim boundary.
    max-depth: -1
    base-claim-only: true
    combat-allowed: false
    shop-price: 200000
    per-use-fee: 250
    material: BUCKET
    glow: true
    name: "<dark_purple>Obsidian Downward Bucket"
    lore:
      - "<gray>Right-click a block to place a"
      - "<gray>column of obsidian down to the"
      - "<gray>world bottom or first obstruction."
      - "<gray>Base Claims only. Reusable."
  outward:
    enabled: true
    flow-pattern: outward
    max-length: 16
    base-claim-only: true
    combat-allowed: false
    shop-price: 75000
    per-use-fee: 100
    material: BUCKET
    glow: true
    name: "<dark_purple>Obsidian Outward Bucket"
    lore:
      - "<gray>Right-click a block to place a"
      - "<gray>16-block obsidian line in the"
      - "<gray>clicked face's direction."
      - "<gray>Base Claims only. Reusable."

cobblestone:
  downward:
    enabled: true
    flow-pattern: downward
    # -1 means continue until the world's bottom, an obstruction, or a claim boundary.
    max-depth: -1
    base-claim-only: true
    combat-allowed: false
    shop-price: 60000
    per-use-fee: 100
    material: BUCKET
    glow: true
    name: "<gray>Cobblestone Downward Bucket"
    lore:
      - "<gray>Right-click a block to place a"
      - "<gray>column of cobblestone down to the"
      - "<gray>world bottom or first obstruction."
      - "<gray>Base Claims only. Reusable."
  outward:
    enabled: true
    flow-pattern: outward
    max-length: 16
    base-claim-only: true
    combat-allowed: false
    shop-price: 25000
    per-use-fee: 50
    material: BUCKET
    glow: true
    name: "<gray>Cobblestone Outward Bucket"
    lore:
      - "<gray>Right-click a block to place a"
      - "<gray>16-block cobblestone line in the"
      - "<gray>clicked face's direction."
      - "<gray>Base Claims only. Reusable."

# Faction claim names Source Buckets are always blocked in -- matches
# whatever you named your system factions via /f claim <Safezone|Warzone>.
# Independent from abilities.disabled-claim-names (config.yml) and from
# chunkbuster.yml's own list, for the same reason chunkbuster.yml gives
# itself one instead of reusing abilities.disabled-claim-names: this
# feature needs both blocked by default with no admin bypass, so it gets
# its own independently configurable list rather than silently depending
# on another feature's.
disabled-claim-names:
  - safezone
  - warzone
