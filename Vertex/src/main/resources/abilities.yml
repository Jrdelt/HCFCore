abilities:
  pearl-stunner:
    material: END_ROD
    name: '<light_purple>ᴘᴇᴀʀʟ sᴛᴜɴɴᴇʀ'
    lore:
      - '<gray>ʜɪᴛ ᴀ ᴘʟᴀʏᴇʀ ᴛᴏ sᴛᴏᴘ ᴛʜᴇᴍ ғʀᴏᴍ'
      - '<gray>ᴜsɪɴɢ ᴘᴇᴀʀʟs ғᴏʀ ᴀ sʜᴏʀᴛ ᴛɪᴍᴇ.'
    cooldown-seconds: 45
    stun-seconds: 8

  rabbits-feed:
    material: GOLDEN_CARROT
    name: '<green>ʀᴀʙʙɪᴛ''s ғᴇᴇᴅ'
    lore:
      - '<gray>ʀɪɢʜᴛ-ᴄʟɪᴄᴋ ғᴏʀ sᴘᴇᴇᴅ ᴠ.'
    cooldown-seconds: 60
    speed-duration-seconds: 5

  jump-boost-feather:
    material: CHORUS_FRUIT
    name: '<green>ᴊᴜᴍᴘ ʙᴏᴏsᴛ ғʀᴜɪᴛ'
    lore:
      - '<gray>ʀɪɢʜᴛ-ᴄʟɪᴄᴋ ғᴏʀ ᴊᴜᴍᴘ ʙᴏᴏsᴛ ᴠ.'
    cooldown-seconds: 45
    jump-duration-seconds: 6

  anti-blockup-bone:
    material: BONE
    name: '<white>ᴀɴᴛɪ-ʙʟᴏᴄᴋᴜᴘ ʙᴏɴᴇ'
    lore:
      - '<gray>ʜɪᴛ ᴀɴ ᴇɴᴇᴍʏ ᴛᴡᴏ ᴛɪᴍᴇs ᴛᴏ sᴛᴏᴘ'
      - '<gray>ᴛʜᴇᴍ ғʀᴏᴍ ᴘʟᴀᴄɪɴɢ ʙʟᴏᴄᴋs ғᴏʀ'
      - '<gray>ᴀ sʜᴏʀᴛ ᴛɪᴍᴇ.'
    cooldown-seconds: 90
    hits-required: 2
    deny-seconds: 8

  fake-pearl:
    material: ENDER_PEARL
    name: '<light_purple>ғᴀᴋᴇ ᴘᴇᴀʀʟ'
    lore:
      - '<gray>ᴛʜʀᴏᴡs ᴀ ᴘᴇᴀʀʟ ᴛʜᴀᴛ ʟᴏᴏᴋs ʀᴇᴀʟ'
      - '<gray>ʙᴜᴛ ɴᴇᴠᴇʀ ᴀᴄᴛᴜᴀʟʟʏ ᴛᴇʟᴇᴘᴏʀᴛs'
      - '<gray>ʏᴏᴜ -- ʙᴀɪᴛ ʏᴏᴜʀ ᴇɴᴇᴍʏ.'
    cooldown-seconds: 45

  grappling-hook:
    material: FISHING_ROD
    name: '<blue>ɢʀᴀᴘᴘʟɪɴɢ ʜᴏᴏᴋ'
    lore:
      - '<gray>ʜᴏᴏᴋ ᴀ ʙʟᴏᴄᴋ ᴏʀ ᴘʟᴀʏᴇʀ ᴀɴᴅ'
      - '<gray>ʀᴇᴇʟ ʏᴏᴜʀsᴇʟғ ᴛᴏᴡᴀʀᴅ ɪᴛ.'
    cooldown-seconds: 20
    uses: 4
    forward-multiplier: 1.9
    y-multiplier: 0.6

  leap:
    material: FIREWORK_ROCKET
    name: '<red>ʟᴇᴀᴘ'
    lore:
      - '<gray>ʟᴀᴜɴᴄʜᴇs ʏᴏᴜ ғᴏʀᴡᴀʀᴅ ᴀɴᴅ'
      - '<gray>sʟɪɢʜᴛʟʏ ᴜᴘᴡᴀʀᴅ.'
    cooldown-seconds: 45
    forward-multiplier: 2.2
    y-multiplier: 0.9
    effect-type: SPEED
    effect-amplifier: 4
    effect-duration-seconds: 5

  rogue-backstab:
    material: GOLDEN_SWORD
    name: '<yellow>ɢᴏʟᴅ ᴅᴀɢɢᴇʀ'
    lore:
      - '<gray>ʜɪᴛ ᴀɴ ᴇɴᴇᴍʏ ғʀᴏᴍ ʙᴇʜɪɴᴅ ғᴏʀ 3 ʜᴇᴀʀᴛs.'
      - '<gray>ᴄᴏɴsᴜᴍᴇᴅ ᴏɴ sᴜᴄᴄᴇssғᴜʟ ᴜsᴇ.'
    cooldown-seconds: 90
    damage: 6.0

  mage-wither:
    material: WITHER_SKELETON_SKULL
    name: '<light_purple>ᴡɪᴛʜᴇʀ sᴘᴇʟʟ'
    lore:
      - '<gray>ʜɪᴛ ᴀɴ ᴇɴᴇᴍʏ ᴛᴏ ᴀᴘᴘʟʏ ᴡɪᴛʜᴇʀ.'
    cooldown-seconds: 8
    effect-type: WITHER
    effect-amplifier: 0
    effect-duration-seconds: 3

  mage-slowness:
    material: COBWEB
    name: '<#8B4513>sʟᴏᴡɴᴇss sᴘᴇʟʟ'
    lore:
      - '<gray>ʜɪᴛ ᴀɴ ᴇɴᴇᴍʏ ᴛᴏ ᴀᴘᴘʟʏ sʟᴏᴡɴᴇss.'
    cooldown-seconds: 8
    effect-type: SLOWNESS
    effect-amplifier: 1
    effect-duration-seconds: 3

  mage-poison:
    material: SPIDER_EYE
    name: '<green>ᴘᴏɪsᴏɴ sᴘᴇʟʟ'
    lore:
      - '<gray>ʜɪᴛ ᴀɴ ᴇɴᴇᴍʏ ᴛᴏ ᴀᴘᴘʟʏ ᴘᴏɪsᴏɴ.'
    cooldown-seconds: 8
    effect-type: POISON
    effect-amplifier: 1
    effect-duration-seconds: 3

  portable-bard:
    material: NOTE_BLOCK
    name: '<light_purple>ᴘᴏʀᴛᴀʙʟᴇ ʙᴀʀᴅ'
    lore:
      - '<gray>ʀɪɢʜᴛ-ᴄʟɪᴄᴋ ᴛᴏ ᴏᴘᴇɴ ᴀ ᴍᴇɴᴜ ᴀɴᴅ'
      - '<gray>ʀᴇᴄᴇɪᴠᴇ ᴀ ʙᴜғғ ɪᴛᴇᴍ (sᴘᴇᴇᴅ, sᴛʀᴇɴɢᴛʜ,'
      - '<gray>ʀᴇsɪsᴛᴀɴᴄᴇ, ʀᴇɢᴇɴ, ᴏʀ ᴊᴜᴍᴘ ʙᴏᴏsᴛ).'
    # No cooldown -- opening the menu and receiving a buff item is free;
    # the actual buff items below carry their own cooldown once used.
    cooldown-seconds: 0

  bard-buff-speed:
    material: SUGAR
    name: '<gold>sᴘᴇᴇᴅ ɪɪ'
    lore:
      - '<gray>ʀɪɢʜᴛ-ᴄʟɪᴄᴋ ᴛᴏ ɢʀᴀɴᴛ sᴘᴇᴇᴅ ᴛᴏ ʏᴏᴜʀ ғᴀᴄᴛɪᴏɴ.'
      - '<gray>ᴅᴏᴜʙʟᴇᴅ ɪғ ᴡᴏʀɴ ɪɴ ᴛʜᴇ ʙᴀʀᴅ ᴋɪᴛ, ʜᴀʟᴠᴇᴅ ᴏᴛʜᴇʀᴡɪsᴇ.'
    cooldown-seconds: 7
    effect-type: SPEED
    effect-amplifier: 1
    buff-seconds: 5

  bard-buff-strength:
    material: BLAZE_POWDER
    name: '<gold>sᴛʀᴇɴɢᴛʜ ɪ'
    lore:
      - '<gray>ʀɪɢʜᴛ-ᴄʟɪᴄᴋ ᴛᴏ ɢʀᴀɴᴛ sᴛʀᴇɴɢᴛʜ ᴛᴏ ʏᴏᴜʀ ғᴀᴄᴛɪᴏɴ.'
      - '<gray>ᴅᴏᴜʙʟᴇᴅ ɪғ ᴡᴏʀɴ ɪɴ ᴛʜᴇ ʙᴀʀᴅ ᴋɪᴛ, ʜᴀʟᴠᴇᴅ ᴏᴛʜᴇʀᴡɪsᴇ.'
    cooldown-seconds: 7
    effect-type: STRENGTH
    effect-amplifier: 1
    buff-seconds: 3

  bard-buff-resistance:
    material: IRON_INGOT
    name: '<gold>ʀᴇsɪsᴛᴀɴᴄᴇ ɪ'
    lore:
      - '<gray>ʀɪɢʜᴛ-ᴄʟɪᴄᴋ ᴛᴏ ɢʀᴀɴᴛ ʀᴇsɪsᴛᴀɴᴄᴇ ᴛᴏ ʏᴏᴜʀ ғᴀᴄᴛɪᴏɴ.'
      - '<gray>ᴅᴏᴜʙʟᴇᴅ ɪғ ᴡᴏʀɴ ɪɴ ᴛʜᴇ ʙᴀʀᴅ ᴋɪᴛ, ʜᴀʟᴠᴇᴅ ᴏᴛʜᴇʀᴡɪsᴇ.'
    cooldown-seconds: 7
    effect-type: RESISTANCE
    effect-amplifier: 1
    buff-seconds: 6

  bard-buff-regeneration:
    material: GHAST_TEAR
    name: '<gold>ʀᴇɢᴇɴᴇʀᴀᴛɪᴏɴ ɪ'
    lore:
      - '<gray>ʀɪɢʜᴛ-ᴄʟɪᴄᴋ ᴛᴏ ɢʀᴀɴᴛ ʀᴇɢᴇɴᴇʀᴀᴛɪᴏɴ ᴛᴏ ʏᴏᴜʀ ғᴀᴄᴛɪᴏɴ.'
      - '<gray>ᴅᴏᴜʙʟᴇᴅ ɪғ ᴡᴏʀɴ ɪɴ ᴛʜᴇ ʙᴀᴅ ᴋɪᴛ, ʜᴀʟᴠᴇᴅ ᴏᴛʜᴇʀᴡɪsᴇ.'
    cooldown-seconds: 7
    effect-type: REGENERATION
    effect-amplifier: 1
    buff-seconds: 5

  bard-buff-jump-boost:
    material: FEATHER
    name: '<gold>ᴊᴜᴍᴘ ʙᴏᴏsᴛ ɪɪ'
    lore:
      - '<gray>ʀɪɢʜᴛ-ᴄʟɪᴄᴋ ᴛᴏ ɢʀᴀɴᴛ ᴊᴜᴍᴘ ʙᴏᴏsᴛ ᴛᴏ ʏᴏᴜʀ ғᴀᴄᴛɪᴏɴ.'
      - '<gray>ᴅᴏᴜʙʟᴇᴅ ɪғ ᴡᴏʀɴ ɪɴ ᴛʜᴇ ʙᴀʀᴅ ᴋɪᴛ, ʜᴀʟᴠᴇᴅ ᴏᴛʜᴇʀᴡɪsᴇ.'
    cooldown-seconds: 7
    effect-type: JUMP_BOOST
    effect-amplifier: 1
    buff-seconds: 6

  repair:
    material: ANVIL
    name: '<light_purple>ʀᴇᴘᴀɪʀ'
    lore:
      - '<gray>ɢʀᴀɴᴛs ᴛᴇᴍᴘᴏʀᴀʀʏ ᴀᴄᴄᴇss ᴛᴏ'
      - '<gray>ʀᴇᴘᴀɪʀ ʏᴏᴜʀ ɢᴇᴀʀ, ᴡɪᴛʜ ᴀ'
      - '<gray>ᴄᴏᴜɴᴛᴅᴏᴡɴ ᴏɴ ʏᴏᴜʀ sᴄᴏʀᴇʙᴏᴀʀᴅ.'
    cooldown-seconds: 1200
    duration-seconds: 30
    permission-node: essentials.fix

  switcher-snowball:
    material: SNOWBALL
    name: '<white>sᴡɪᴛᴄʜᴇʀ sɴᴏᴡʙᴀʟʟ'
    lore:
      - '<gray>ᴛʜʀᴏᴡ ᴀᴛ ᴀɴ ᴇɴᴇᴍʏ ᴛᴏ sᴡᴀᴘ'
      - '<gray>ᴘʟᴀᴄᴇs ᴡɪᴛʜ ᴛʜᴇᴍ.'
    cooldown-seconds: 45

  time-warp-pearl:
    material: ENDER_EYE
    name: '<light_purple>ᴛɪᴍᴇ ᴡᴀʀᴘ ᴘᴇᴀʀʟ'
    lore:
      - '<gray>ᴛᴇʟᴇᴘᴏʀᴛs ʏᴏᴜ ʙᴀᴄᴋ ᴛᴏ ᴛʜᴇ ʟᴀsᴛ'
      - '<gray>ᴘʟᴀᴄᴇ ʏᴏᴜ ᴀᴄᴛᴜᴀʟʟʏ ᴇɴᴅᴇʀ'
      - '<gray>ᴘᴇᴀʀʟᴇᴅ ғʀᴏᴍ.'
    cooldown-seconds: 45

  ninja-star:
    material: COMPASS
    name: '<light_purple>ɴɪɴᴊᴀ sᴛᴀʀ'
    lore:
      - '<gray>ᴛᴇʟᴇᴘᴏʀᴛ ᴛᴏ ᴡʜᴏᴇᴠᴇʀ ʜɪᴛ ʏᴏᴜ'
      - '<gray>ʟᴀsᴛ, ᴀғᴛᴇʀ ᴀ 5s ᴡᴀʀɴɪɴɢ ᴛᴏ'
      - '<gray>ᴛʜᴇᴍ. ɴᴇᴇᴅs ᴀ ʜɪᴛ ᴡɪᴛʜɪɴ ᴛʜᴇ'
      - '<gray>ʟᴀsᴛ 15s ᴀɴᴅ ʙᴏᴛʜ ᴏғ ʏᴏᴜ ɪɴ ᴄᴏᴍʙᴀᴛ.'
    cooldown-seconds: 120