abilities:
  pearl-stunner:
    material: END_ROD
    name: '<light_purple>Pearl Stunner'
    lore:
      - '<gray>Hit a player to stop them from'
      - '<gray>using pearls for a short time.'
    cooldown-seconds: 30
    stun-seconds: 8

  rabbits-feed:
    material: FEATHER
    name: '<green>Rabbit''s Feed'
    lore:
      - '<gray>Right-click for Speed V.'
    cooldown-seconds: 30
    speed-duration-seconds: 8

  jump-boost-feather:
    material: FEATHER
    name: '<green>Jump Boost Feather'
    lore:
      - '<gray>Right-click for Jump Boost V.'
    cooldown-seconds: 30
    jump-duration-seconds: 8

  anti-blockup-bone:
    material: BONE
    name: '<white>Anti-Blockup Bone'
    lore:
      - '<gray>Hit an enemy with this to stop'
      - '<gray>them from placing blocks for'
      - '<gray>a short time.'
    cooldown-seconds: 60
    hits-required: 3
    deny-seconds: 15

  fake-pearl:
    material: ENDER_PEARL
    name: '<light_purple>Fake Pearl'
    lore:
      - '<gray>Throws a pearl that looks real'
      - '<gray>but never actually teleports'
      - '<gray>you -- bait your enemy.'
    cooldown-seconds: 30

  grappling-hook:
    material: FISHING_ROD
    name: '<blue>Grappling Hook'
    lore:
      - '<gray>Hook a block or player and'
      - '<gray>reel yourself toward it.'
    cooldown-seconds: 20
    uses: 8
    forward-multiplier: 1.6
    y-multiplier: 0.8

  leap:
    material: FIREWORK_ROCKET
    name: '<red>Leap'
    lore:
      - '<gray>Launches you forward and'
      - '<gray>slightly upward.'
    cooldown-seconds: 45
    forward-multiplier: 1.4
    y-multiplier: 0.6
    effect-type: SPEED
    effect-amplifier: 4
    effect-duration-seconds: 5

  rogue-backstab:
    material: GOLDEN_SWORD
    name: '<yellow>Gold Dagger'
    lore:
      - '<gray>Hit an enemy from behind for 3 hearts.'
      - '<gray>Consumed on use.'
    cooldown-seconds: 20
    damage: 6.0

  mage-wither:
    material: WITHER_SKELETON_SKULL
    name: '<light_purple>Wither Spell'
    lore:
      - '<gray>Hit an enemy to apply Wither.'
    cooldown-seconds: 25
    effect-type: WITHER
    effect-amplifier: 0
    effect-duration-seconds: 5

  mage-slowness:
    material: COBWEB
    name: '<#8B4513>Slowness Spell'
    lore:
      - '<gray>Hit an enemy to apply Slowness.'
    cooldown-seconds: 20
    effect-type: SLOWNESS
    effect-amplifier: 1
    effect-duration-seconds: 5

  mage-poison:
    material: SPIDER_EYE
    name: '<green>Poison Spell'
    lore:
      - '<gray>Hit an enemy to apply Poison.'
    cooldown-seconds: 25
    effect-type: POISON
    effect-amplifier: 0
    effect-duration-seconds: 5

  portable-bard:
    material: NOTE_BLOCK
    name: '<light_purple>Portable Bard'
    lore:
      - '<gray>Right-click to choose a buff'
      - '<gray>(Strength, Speed, or Regen) and'
      - '<gray>share it with your whole faction.'
    # The long cooldown is for anyone using the item outside the class it
    # belongs to; a player in the full gold bard set uses the short one.
    cooldown-seconds: 300
    bard-cooldown-seconds: 6
    # Each buff in the GUI also gets its own cooldown, so a bard can rotate
    # between buffs but can't re-apply the same one back to back.
    buff-cooldown-seconds: 7
    buff-seconds: 6

  repair:
    material: ANVIL
    name: '<light_purple>Repair'
    lore:
      - '<gray>Grants temporary access to'
      - '<gray>repair your gear, with a'
      - '<gray>countdown on your scoreboard.'
    cooldown-seconds: 600
    duration-seconds: 60
    permission-node: essentials.fix

  switcher-snowball:
    material: SNOWBALL
    name: '<white>Switcher Snowball'
    lore:
      - '<gray>Throw at an enemy to swap'
      - '<gray>places with them.'
    cooldown-seconds: 30

  time-warp-pearl:
    material: ENDER_EYE
    name: '<light_purple>Time Warp Pearl'
    lore:
      - '<gray>Teleports you back to the last'
      - '<gray>place you actually ender'
      - '<gray>pearled from.'
    cooldown-seconds: 30

  ninja-star:
    material: NETHER_STAR
    name: '<light_purple>Ninja Star'
    lore:
      - '<gray>Teleport to whoever hit you'
      - '<gray>last, after a 5s warning to'
      - '<gray>them. Needs a hit within the'
      - '<gray>last 15s and both of you in combat.'
    cooldown-seconds: 60
