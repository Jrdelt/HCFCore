abilities:
  pearl-stunner:
    material: END_ROD
    name: '<light_purple>Pearl Stunner'
    lore:
      - '<gray>Hit a player to stop them from'
      - '<gray>using pearls for a short time.'
    cooldown-seconds: 30
    stun-seconds: 8

  rabbits-feed:
    material: GOLDEN_CARROT
    name: '<green>Rabbit''s Feed'
    lore:
      - '<gray>Right-click for Speed V.'
    cooldown-seconds: 30
    speed-duration-seconds: 8

  jump-boost-feather:
    material: CHORUS_FRUIT
    name: '<green>Jump Boost Fruit'
    lore:
      - '<gray>Right-click for Jump Boost V.'
    cooldown-seconds: 30
    jump-duration-seconds: 8

  anti-blockup-bone:
    material: BONE
    name: '<white>Anti-Blockup Bone'
    lore:
      - '<gray>Hit an enemy with this to stop'
      - '<gray>them from placing blocks for'
      - '<gray>a short time.'
    cooldown-seconds: 60
    hits-required: 3
    deny-seconds: 15

  fake-pearl:
    material: ENDER_PEARL
    name: '<light_purple>Fake Pearl'
    lore:
      - '<gray>Throws a pearl that looks real'
      - '<gray>but never actually teleports'
      - '<gray>you -- bait your enemy.'
    cooldown-seconds: 30

  grappling-hook:
    material: FISHING_ROD
    name: '<blue>Grappling Hook'
    lore:
      - '<gray>Hook a block or player and'
      - '<gray>reel yourself toward it.'
    cooldown-seconds: 20
    uses: 8
    forward-multiplier: 1.6
    y-multiplier: 0.8

  leap:
    material: FIREWORK_ROCKET
    name: '<red>Leap'
    lore:
      - '<gray>Launches you forward and'
      - '<gray>slightly upward.'
    cooldown-seconds: 45
    forward-multiplier: 1.4
    y-multiplier: 0.6
    effect-type: SPEED
    effect-amplifier: 4
    effect-duration-seconds: 5

  rogue-backstab:
    material: GOLDEN_SWORD
    name: '<yellow>Gold Dagger'
    lore:
      - '<gray>Hit an enemy from behind for 3 hearts.'
      - '<gray>Consumed on use.'
    cooldown-seconds: 20
    damage: 6.0

  mage-wither:
    material: WITHER_SKELETON_SKULL
    name: '<light_purple>Wither Spell'
    lore:
      - '<gray>Hit an enemy to apply Wither.'
    cooldown-seconds: 25
    effect-type: WITHER
    effect-amplifier: 0
    effect-duration-seconds: 5

  mage-slowness:
    material: COBWEB
    name: '<#8B4513>Slowness Spell'
    lore:
      - '<gray>Hit an enemy to apply Slowness.'
    cooldown-seconds: 20
    effect-type: SLOWNESS
    effect-amplifier: 1
    effect-duration-seconds: 5

  mage-poison:
    material: SPIDER_EYE
    name: '<green>Poison Spell'
    lore:
      - '<gray>Hit an enemy to apply Poison.'
    cooldown-seconds: 25
    effect-type: POISON
    effect-amplifier: 0
    effect-duration-seconds: 5

  portable-bard:
    material: NOTE_BLOCK
    name: '<light_purple>Portable Bard'
    lore:
      - '<gray>Right-click to open a menu and'
      - '<gray>receive a buff item (Speed, Strength,'
      - '<gray>Resistance, Regen, or Jump Boost).'
    # No cooldown -- opening the menu and receiving a buff item is free;
    # the actual buff items below carry their own cooldown once used.
    cooldown-seconds: 0

  bard-buff-speed:
    material: SUGAR
    name: '<gold>Speed II'
    lore:
      - '<gray>Right-click to grant Speed to your faction.'
      - '<gray>Doubled if worn in the bard kit, halved otherwise.'
    cooldown-seconds: 7
    effect-type: SPEED
    effect-amplifier: 1
    buff-seconds: 6

  bard-buff-strength:
    material: BLAZE_POWDER
    name: '<gold>Strength I'
    lore:
      - '<gray>Right-click to grant Strength to your faction.'
      - '<gray>Doubled if worn in the bard kit, halved otherwise.'
    cooldown-seconds: 7
    effect-type: STRENGTH
    effect-amplifier: 0
    buff-seconds: 6

  bard-buff-resistance:
    material: IRON_INGOT
    name: '<gold>Resistance I'
    lore:
      - '<gray>Right-click to grant Resistance to your faction.'
      - '<gray>Doubled if worn in the bard kit, halved otherwise.'
    cooldown-seconds: 7
    effect-type: RESISTANCE
    effect-amplifier: 0
    buff-seconds: 6

  bard-buff-regeneration:
    material: GHAST_TEAR
    name: '<gold>Regeneration I'
    lore:
      - '<gray>Right-click to grant Regeneration to your faction.'
      - '<gray>Doubled if worn in the bard kit, halved otherwise.'
    cooldown-seconds: 7
    effect-type: REGENERATION
    effect-amplifier: 0
    buff-seconds: 6

  bard-buff-jump-boost:
    material: FEATHER
    name: '<gold>Jump Boost II'
    lore:
      - '<gray>Right-click to grant Jump Boost to your faction.'
      - '<gray>Doubled if worn in the bard kit, halved otherwise.'
    cooldown-seconds: 7
    effect-type: JUMP_BOOST
    effect-amplifier: 1
    buff-seconds: 6

  repair:
    material: ANVIL
    name: '<light_purple>Repair'
    lore:
      - '<gray>Grants temporary access to'
      - '<gray>repair your gear, with a'
      - '<gray>countdown on your scoreboard.'
    cooldown-seconds: 600
    duration-seconds: 60
    permission-node: essentials.fix

  switcher-snowball:
    material: SNOWBALL
    name: '<white>Switcher Snowball'
    lore:
      - '<gray>Throw at an enemy to swap'
      - '<gray>places with them.'
    cooldown-seconds: 30

  time-warp-pearl:
    material: ENDER_EYE
    name: '<light_purple>Time Warp Pearl'
    lore:
      - '<gray>Teleports you back to the last'
      - '<gray>place you actually ender'
      - '<gray>pearled from.'
    cooldown-seconds: 30

  ninja-star:
    material: COMPASS
    name: '<light_purple>Ninja Star'
    lore:
      - '<gray>Teleport to whoever hit you'
      - '<gray>last, after a 5s warning to'
      - '<gray>them. Needs a hit within the'
      - '<gray>last 15s and both of you in combat.'
    cooldown-seconds: 60
