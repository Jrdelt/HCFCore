# Mining worlds.
#
# The two mines ship fully configured except for WHERE they are. Define that
# in-game rather than by typing coordinates:
#
#   /mines wand stonewake     gives the blaze rod and starts a selection
#   left-click                first corner
#   right-click               second corner
#   sneak + click air         saves it
#
# Saving writes the world and both corners into this file for you, exactly
# like /koth create. Until a mine has been defined that way its `world` stays
# blank and the mine is simply inactive -- nothing else here needs changing.
#
# The worlds themselves are yours to create/import (Multiverse or otherwise);
# Vertex only controls what happens inside the region you select.

enabled: true

selection:
  # A 700x700 floor 100 deep is 49,000,000 blocks, so this is deliberately
  # generous. It exists to catch a mis-click that would select half a world.
  maximum-volume: 60000000

regeneration:
  # One shared worker drains the queue of mined locations. There is never a
  # scheduled task per block, and the region is never scanned -- only blocks
  # that were actually mined are ever visited.
  worker-interval-ticks: 5
  max-per-pass: 100
  # Blocks seeded per pass when a mine is first filled (/mines fill, and
  # automatically when a region is placed). Regeneration alone only touches
  # blocks a player already mined, so this is what actually puts ore in the
  # ground. Raise it to fill faster; lower it if filling causes lag.
  fill-blocks-per-tick: 4000

# Players inside a mine region may only break blocks the mine generates.
# Structure, walls, floor, and decoration are therefore safe without listing
# them. Placing blocks inside a region is denied outright, which is also what
# makes "is this ore plugin-generated?" answerable without tracking half a
# million positions: nothing inside the region can be player-placed.
protection:
  deny-block-place: true
  deny-non-mine-block-break: true

mines:
  stonewake:
    display-name: "ꜱᴛᴏɴᴇᴡᴀᴋᴇ"
    # Filled in by /mines wand stonewake -- leave blank.
    world: ''
    pvp: koth-zone-only
    icon: IRON_BLOCK
    regen-delay-seconds: 30
    # Ore replaces only these, so generation can never overwrite structure.
    base-blocks:
      - STONE
      - DEEPSLATE
    # weight is relative; it does not have to total 100. drop is the base
    # amount mined before any booster.
    ores:
      STONE:
        weight: 90.0
        drop: 1
      COAL_ORE:
        weight: 4.5
        drop: 1
      IRON_ORE:
        weight: 3.5
        drop: 1
      REDSTONE_ORE:
        weight: 2.0
        drop: 1

    # The Mine KOTH capture zone, a sub-region of this mine. Place it with
    #   /mines wand stonewake koth
    # using the same blaze rod; the corners are written back here.
    #
    # Control runs 0-100%. An attacker wears the holder's control down first
    # and only starts climbing their own once it reaches zero, so taking a
    # defended point costs about twice an empty capture. The booster is only
    # active at 100% control.
    koth:
      enabled: true
      capture-seconds: 180
      # Floating board over the capture zone, same shape as a scheduled
      # KOTH's. {name}, {owner}, {control}, {booster}, {held}, {next}, and
      # {status} are available.
      hologram:
        enabled: true
        lines:
          - '&4&lMINE KOTH &f{name}'
          - '&e{control}% &7• &7Owner: &b{owner}'
          - '&7Booster: &a+{booster}% &7• Held: &f{held}'
      multiple-members-speed-up: true
      additional-member-speed: 0.25
      max-counted-members: 5
      max-speed-multiplier: 2.0
      # Control falling below this wipes booster progression back to the
      # first stage. Between it and 100% the booster is inactive but the
      # earned stage is only paused, not lost.
      booster-reset-threshold: 50.0
      # Ore Drop bonus by continuous hold time. Every stage is stated
      # outright -- no multiplier is derived between them.
      booster-tiers:
        - after-seconds: 0
          percent: 5.0
        - after-seconds: 1800
          percent: 10.0
        - after-seconds: 3600
          percent: 15.0
        - after-seconds: 7200
          percent: 20.0

  bloodvein:
    display-name: "ʙʟᴏᴏᴅᴠᴇɪɴ"
    world: ''
    pvp: enabled
    icon: NETHERITE_BLOCK
    regen-delay-seconds: 30
    base-blocks:
      - STONE
      - DEEPSLATE
      - BLACKSTONE
    ores:
      STONE:
        weight: 96.195
        drop: 1
      GOLD_ORE:
        weight: 1.5
        drop: 1
      LAPIS_ORE:
        weight: 1.0
        drop: 1
      DIAMOND_ORE:
        weight: 0.8
        drop: 1
      EMERALD_ORE:
        weight: 0.5
        drop: 1
      # Intentionally extreme: roughly one in twenty thousand blocks.
      NETHERITE_BLOCK:
        weight: 0.005
        drop: 1

    # The Mine KOTH capture zone, a sub-region of this mine. Place it with
    #   /mines wand bloodvein koth
    # using the same blaze rod; the corners are written back here.
    #
    # Control runs 0-100%. An attacker wears the holder's control down first
    # and only starts climbing their own once it reaches zero, so taking a
    # defended point costs about twice an empty capture. The booster is only
    # active at 100% control.
    koth:
      enabled: true
      capture-seconds: 180
      # Floating board over the capture zone, same shape as a scheduled
      # KOTH's. {name}, {owner}, {control}, {booster}, {held}, {next}, and
      # {status} are available.
      hologram:
        enabled: true
        lines:
          - '&4&lMINE KOTH &f{name}'
          - '&e{control}% &7• &7Owner: &b{owner}'
          - '&7Booster: &a+{booster}% &7• Held: &f{held}'
      multiple-members-speed-up: true
      additional-member-speed: 0.25
      max-counted-members: 5
      max-speed-multiplier: 2.0
      # Control falling below this wipes booster progression back to the
      # first stage. Between it and 100% the booster is inactive but the
      # earned stage is only paused, not lost.
      booster-reset-threshold: 50.0
      # Ore Drop bonus by continuous hold time. Every stage is stated
      # outright -- no multiplier is derived between them.
      booster-tiers:
        - after-seconds: 0
          percent: 5.0
        - after-seconds: 1800
          percent: 10.0
        - after-seconds: 3600
          percent: 15.0
        - after-seconds: 7200
          percent: 20.0
