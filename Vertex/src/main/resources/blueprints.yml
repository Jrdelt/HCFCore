# ============================================
# AUTOMATED BLUEPRINT BASE BUILDER
# ============================================
# Placing a Blueprint item opens an activation confirmation. Clicking Enable
# consumes it, places its Beacon, and gradually builds a .schem structure
# around it using FastAsyncWorldEdit's clipboard API, with a DecentHolograms
# progress display above the beacon. Requires both FastAsyncWorldEdit and
# DecentHolograms -- this feature quietly does nothing if either is missing.
enabled: true

# .schem files live in <plugin data folder>/schematics/<file>.
schematics-folder: schematics

# Cooldown (seconds) per player between placing a new blueprint.
cooldown-seconds: 3600

# How long a build should take to fully place, start to finish.
build-time-seconds: 600

# How often build progress is saved and the hologram is refreshed. Blocks
# themselves are placed every tick, bottom-to-top and row-by-row.
batch-interval-ticks: 20

# Safety cap for how many blocks one active Blueprint may place in a single
# server tick. A very large schematic can take longer than build-time-seconds
# when this cap is reached, protecting TPS instead of causing a paste spike.
max-blocks-per-tick: 64

# Every touched chunk's claim ownership is re-checked this often while a
# build is in progress -- if it's no longer 100% the placing faction's
# claimed land, the build aborts immediately (blocks placed so far are
# left as-is, the beacon is not refunded).
claim-recheck-interval-ticks: 100

# Each entry here is a placeable Blueprint (see /blueprint give).
templates:
  outpost:
    schematic: outpost.schem
    display-name: '<gold>Outpost Blueprint'
