      # Gilded Catch's booster potions are individual (personal), not
      # server-wide: min/max-exp-percent and min/max-sell-percent cap the
      # full possible range of a rolled potion's percent (15-200% for EXP,
      # 25-124% for Sell, fully configurable), and min/max-*-duration-seconds
      # cap how long one lasts once drunk (Sell boosters never longer than
      # 60s, EXP boosters never longer than 30 minutes = 1800s).
      # booster-chance (out of 100, separate from proc-chance/success-rate
      # above) is how often a given genuine catch grants a potion at all --
      # a higher-level rod is straightforwardly better here, from 1% at
      # level 1 up to 15% at level 10. Level also biases WHICH percent/
      # duration gets rolled within that same min/max range (see
      # RuneEffectListener#biasedFloor): a level 1 rod can still roll
      # anywhere in the full range, but a level 10 rod's roll floor is
      # pushed close to the ceiling, so its boosters consistently land near
      # the top instead of anywhere in it.
      gilded_catch:
