# ============================================
# CUSTOM ENCHANTMENTS / RUNES -- ALL SERVER RUNES
# ============================================
# Every rune on the server, of every tier (Arena included), lives here in one
# file. Each top-level key under `runes:` is a RuneTier; every enchant that
# tier can roll is nested underneath it, fully self-describing (compatible
# items, live effect, tags, and every level's stats -- including that
# level's roll `weight`). No other file defines rune data.
#
# Simple/Elite carry 4 base enchants, Rare/Legendary/Arena carry 3 (Seasonal
# excluded) -- every effect id below still appears in exactly ONE tier, so
# no ability is a stronger reskin of another tier's ability under a
# different name. Each base rune is its own distinct thing; picking a tier
# is about how it's obtained/priced, not "the same ability, again, but
# bigger."
#
# effect is a built-in Rune effect. priority resolves effects sharing a
# trigger. Per-level effect-settings are numeric and fully configurable
# without Java changes.
#
# tags are explicit categorization only -- never inferred -- for future
# tooling (e.g. /runeinfo) to group/filter runes by what they actually do.
#
# A rune with no `weight` on any level (see `legacy:` below) is retained only
# so already-rolled/applied items keep rendering -- it is never rollable.
# `legacy:` is also where every enchant retired by the 3-per-tier cut above
# ended up (Simple/Elite/Rare/Legendary only -- their old effect ids may
# reappear on an already-owned item's tooltip, but can never be rolled
# again). Arena's retired enchants were dropped outright instead: Arena's
# per-level values are synthesized from `level-count`/`per-level-value`,
# which `legacy:` entries don't support, and Arena's steep XP cost means very
# few, if any, were ever actually owned.

# Every identification jitters that level's configured success-rate by +/-
# this many percentage points (clamped to 0-100), so two rolls of the same
# enchant+level almost never land on the exact same value and silently merge
# into one ambiguous inventory stack. Does not apply to a tier with its own
# random-success-range (Arena), which is intentionally a full tier-wide roll.
success-rate-jitter-percent: 10.0

