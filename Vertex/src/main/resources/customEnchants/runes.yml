  # Arena Runes -- previously a separate, hand-written system gated on
  # Haven/Riftlands; now just a fifth tier like any other. `level-count` +
  # `level-buckets` synthesize 20 levels per enchant from one `per-level-value`
  # instead of hand-authoring 20 near-identical level blocks; `random-success-range`
  # re-rolls a fresh success chance on every identify instead of a fixed
  # per-level rate, matching the original Arena Rune mechanic exactly.
  arena:
    material: BLACK_CANDLE
    glow: false
    shop-price: 100
    currency: XP_LEVELS
    level-count: 20
    level-buckets:
      - { from: 1, to: 10, weight: 60 }
      - { from: 11, to: 15, weight: 25 }
      - { from: 16, to: 19, weight: 14 }
      - { from: 20, to: 20, weight: 1 }
