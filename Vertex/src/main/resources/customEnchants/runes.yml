# War Chest I-V is a passive, owner-only BACKPACK booster, not gear-applied
# enchant -- it does not fit EnchantDefinition's compatible-types/apply-to-gear
# shape (see me.vertex.core.backpack.BackpackTier), so it is deliberately NOT
# under `seasonal.enchants` above. Configured here ahead of that separate
# integration (tracked as a follow-up; see chat summary). Units: proc-chance
# is percent per eligible action; cooldown-seconds is the shared
# successful-proc cooldown; potion-level is the player-facing tier (3 = III).
war-chest:
  levels:
    1: { proc-chance-percent: 1, cooldown-seconds: 10 }
    2: { proc-chance-percent: 2, cooldown-seconds: 10 }
    3: { proc-chance-percent: 3, cooldown-seconds: 10 }
