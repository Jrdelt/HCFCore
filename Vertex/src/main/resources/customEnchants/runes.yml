        effect: ZEUS
        bindable: false
        tags: [COMBAT, OFFENSIVE, PASSIVE]
        levels:
          1: { material: GOLD_NUGGET, proc-chance: 4, success-rate: 75, ability-value: 1, weight: 65, effect-settings: { cooldown-seconds: 30 } }
          2: { material: GOLD_NUGGET, proc-chance: 7, success-rate: 60, ability-value: 1.5, weight: 25, effect-settings: { cooldown-seconds: 20 } }
          3: { material: GOLD_NUGGET, glow: true, proc-chance: 10, success-rate: 45, ability-value: 2, weight: 10, effect-settings: { cooldown-seconds: 10 } }

      obliterate:
        display-name: "Obliterate"
        description: "Successful axe hits on enemy players may knock them away from you"
        compatible-types: [AXE]
        effect: OBLITERATE
        bindable: false
        tags: [COMBAT, OFFENSIVE, PASSIVE]
