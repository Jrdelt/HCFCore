  # ==========================================================================
  # SEASONAL -- black-and-gold/eagle-themed crate set. Admin/event-distributed
  # only via `/enchant give <player> item <id> <level> [amount]`; every level
  # below deliberately has NO `weight`, so nothing here is ever rollable from
  # any base Rune. All ten items are fully wired to live gameplay in
  # RuneEffectListener. `bindable` stays false
  # for every effect that has no listener yet, so `/binds` never offers a
  # non-functional ability.
  #
  # Every numeric knob an admin might want to change lives in `ability-value`
  # (this effect's single primary strength number) or `effect-settings`
  # (everything else -- cooldown-seconds, radii, durations, potion levels,
  # etc., all in the units named by their own key). All values below are
  # editable starting defaults, not fixed requirements.
  # No config wiring is needed to tie an ability onto a real item: just
  # `/seasonal catalog save <id>` while holding the real, finished piece --
  # it auto-detects which seasonal Rune is compatible with that item's
  # material (each is configured for exactly one piece type) and bakes it
  # on before saving. From then on, give/roll/the Seasonal Set preview menu
  # all discover and use that saved item automatically -- nothing below
  # needs a `catalog-item` key. That key still exists as a manual override
  # (useful only if two saved items could otherwise both carry the same
  # ability, which shouldn't normally happen) -- see
  # EnchantDefinition.Level#catalogItem.
  #
  # Add `hidden: true` to an enchant (or to a whole `sets: <name>:` block,
  # inherited by everything nested under it) to stage it without releasing
  # it: give/roll/catalog all keep working normally for admins, but it's
  # skipped from the player-facing Seasonal Set preview menu until you flip
  # it back to false (or remove the line). Lets a whole season's worth of
  # gear and abilities get built and tested ahead of time, then revealed
  # all at once.
  #
  # Enchants may optionally be grouped under `sets: <set-name>: enchants:`
  # instead of loose in `enchants:` below -- purely to keep a season's whole
  # set together in this file. The set name is config-organizational only;
  # it never becomes part of the enchant's id or its in-game rune name.
  # Example, in place of (or alongside) the flat `enchants:` block:
  #
  #   sets:
  #     fall:
  #       hidden: true   # whole season staged; flip to false (or delete) to release it
  #       enchants:
  #         huntmasters_call: { ... same shape as any enchant below ... }
  #         golden_bastion: { ... }
  # Expanded Rune Module -- Common tier. Acquisition `weight` on each level
  # uses the spec's own default fallback distribution for that rune's max
  # level (e.g. Max III: 65/25/10) applied identically to every rune of that
  # shape, so every Common rune has equal odds of being the one that rolls
  # and, within it, a harder-to-roll higher level -- never the other way
  # around. `proc-chance` is the unrelated, separately-configured COMBAT
  # proc percent from the spec; never confused with `weight`.
  common:
    material: WHITE_CANDLE
    glow: false
    shop-price: 300.0
    currency: MONEY
    enchants:
      zeus:
        display-name: "Zeus"
        description: "Successful arrow hits on enemy players may call down a visual bolt for bonus damage"
