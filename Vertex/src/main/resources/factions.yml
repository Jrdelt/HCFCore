# Base Claims and Raid Claims -- see docs/base-and-raid-claims.md.
base-claim:
  # Maximum connected chunks a single Base Claim region may grow to. This
  # is per-region (each of a faction's up to 3 Base Claims gets its own
  # 2000-chunk budget), not a combined faction-wide total. Developer-only
  # tuning knob -- not purchasable by players.
  max-chunks-per-region: 2000
  # Slots 2 and 3 are unlocked through the explicit base-claim-slots levels
  # in config.yml under faction-upgrades.

raid-claim:
  # How long a Raid Claim chunk stays claimed with no activity, in real
  # elapsed seconds -- continues counting during server downtime.
  duration-seconds: 25200
  # How often the lightweight expiration sweep checks tracked chunks. It
  # never scans the whole world, only chunks already being tracked.
  sweep-interval-seconds: 30

# Native Vertex Grace and Faction Shield settings.
grace:
  # Hard safety limit accepted by /fa grace on <duration>.
  maximum-duration-seconds: 2592000 # 30 days

shield:
  # Duration before faction-upgrade bonus seconds are added.
  base-duration-seconds: 21600 # 6 hours
  maximum-duration-seconds: 86400 # 24 hours
  # Cooldown starts when protection ends.
  cooldown-seconds: 86400 # 24 hours
  # Optional wait before a newly created faction can activate Shield.
  new-faction-delay-seconds: 0
  # Shield primarily protects against explosions. Enable only if Shield
  # should also prevent PvP inside the protected faction's claims.
  combat-protection-enabled: false
  schedule:
    maximum-hours-per-day: 8
    edit-lock-seconds: 86400
    activation-delay-seconds: 86400
    time-zone: America/Los_Angeles

factions:
  lifecycle:
    create-after-disband-cooldown-seconds: 60
    rename-cooldown-seconds: 21600
  # Vertex owns all faction state. FactionsUUID is not needed at runtime.
  # Tags must match this Java regular expression. Invalid expressions safely
  # fall back to [A-Za-z0-9_]{3,16}.
  tag-pattern: '[A-Za-z0-9_]{3,16}'

  # Prevent faction leaders from using /f leave until leadership is transferred.
  prevent-leader-leave: true

  open-join-enabled: true
  invite-expiry-seconds: 300
  power:
    # Personal power follows a player between factions and survives seasons.
    # Faction power is derived from all current members, including offline members.
    default-current: 100.0
    default-max: 100.0
    absolute-player-cap: 5000.0
    death-loss: 1.0
    regeneration-per-interval: 1.0
    regeneration-interval-seconds: 120
    booster:
      material: NETHER_STAR
      custom-model-data: 0
      glowing: true
      tiers: [10, 25, 50, 75, 100]
  limits:
    members: 16
    claims: 250
    claim-radius: 5
    warps: 5
  claims:
    # One current faction power allows one claimed chunk.
    require-connected: false
    overclaiming:
      enabled: false
  relations:
    ally-limit: 1
    request-expiry-seconds: 7200
  focus:
    duration-seconds: 900
    concurrent-targets: 2
  map:
    # Chat map dimensions. Width is safely capped at 41 and height at 21.
    # 41x20 fills the normal expanded chat box while leaving room for the header.
    width: 41
    height: 20
  pvp:
    friendly-fire: false
    allies-can-pvp: false
  protection:
    allies-can-build: false
  # System faction tags can be used for staff-created SafeZone/WarZone land.
  # PvP is disabled in claims owned by one of these tags.
  system-claims:
    safezone-tag: SafeZone
    warzone-tag: WarZone
    no-pvp-tags: [SafeZone]
  # These are safe defaults. Faction leaders can override an action per role
  # in /f permissions; each action is persisted in the database.
  permissions:
    defaults:
      admin: {}
      mod:
        build: true
        containers: true
        doors: true
        home: true
        invite: true
        kick: true
        bank-deposit: true
        bank-withdraw: true
        chunkbuster-use: true
      member:
        build: true
        containers: true
        doors: true
        home: true
        bank-deposit: true
      recruit:
        home: true

  # Retained for command-preprocess compatibility with established Vertex
  # extension GUIs. Configure aliases in plugin.yml for Bukkit itself.
  command-aliases:
    - f
    - factions
    - faction
    - t

# ============================================
# FACTION UPGRADES
# ============================================
# `/f upgrades` opens Vertex's persistent purchase GUI. Only the faction
# Leader and Co-Leader may purchase. Costs are withdrawn from the clicking
# member through Vault. Every level has an explicit price and total bonus;
# no automatic multiplier is applied. Player effects require own claimed land.
# The Warps bonus adds to `factions.limits.warps` and controls Vertex's native
# `/f setwarp` limit directly.
faction-upgrades:
  enabled: true
  # TNT bank size for a faction that has not bought the tnt-bank upgrade.
  # Each purchased level below replaces this with its own absolute capacity.
  tnt-base-capacity: 1000000
  upgrades:
    claim-damage:
      enabled: true
      levels: {1: {price: 50000.0, bonus: 5.0}, 2: {price: 87500.0, bonus: 10.0}, 3: {price: 153125.0, bonus: 15.0}, 4: {price: 267969.0, bonus: 20.0}, 5: {price: 468945.0, bonus: 25.0}}
    claim-protection:
      enabled: true
      levels: {1: {price: 60000.0, bonus: 4.0}, 2: {price: 105000.0, bonus: 8.0}, 3: {price: 183750.0, bonus: 12.0}, 4: {price: 321563.0, bonus: 16.0}, 5: {price: 562734.0, bonus: 20.0}}
    armor-wear:
      enabled: true
      levels: {1: {price: 40000.0, bonus: 10.0}, 2: {price: 68000.0, bonus: 20.0}, 3: {price: 115600.0, bonus: 30.0}, 4: {price: 196520.0, bonus: 40.0}, 5: {price: 334084.0, bonus: 50.0}}
    fall-protection:
      enabled: true
      levels: {1: {price: 1000000.0, bonus: 10.0}}
    fly-boost:
      enabled: true
      levels: {1: {price: 50000.0, bonus: 20.0}, 2: {price: 250000.0, bonus: 40.0}, 3: {price: 1250000.0, bonus: 60.0}, 4: {price: 6250000.0, bonus: 80.0}, 5: {price: 31250000.0, bonus: 100.0}}
    # `bonus` is additional native Vertex faction warp slots at this level.
    warps:
      enabled: true
      levels: {1: {price: 500000.0, bonus: 1.0}, 2: {price: 1000000.0, bonus: 2.0}, 3: {price: 2000000.0, bonus: 3.0}, 4: {price: 4000000.0, bonus: 4.0}, 5: {price: 8000000.0, bonus: 5.0}, 6: {price: 16000000.0, bonus: 6.0}, 7: {price: 32000000.0, bonus: 7.0}, 8: {price: 64000000.0, bonus: 8.0}, 9: {price: 128000000.0, bonus: 9.0}, 10: {price: 256000000.0, bonus: 10.0}, 11: {price: 512000000.0, bonus: 11.0}, 12: {price: 1000000000.0, bonus: 12.0}, 13: {price: 1000000000.0, bonus: 13.0}, 14: {price: 1000000000.0, bonus: 14.0}, 15: {price: 1000000000.0, bonus: 15.0}}
    spawner-rate:
      enabled: true
      levels: {1: {price: 10000000.0, bonus: 15.0}, 2: {price: 50000000.0, bonus: 30.0}, 3: {price: 250000000.0, bonus: 45.0}, 4: {price: 1000000000.0, bonus: 60.0}, 5: {price: 1000000000.0, bonus: 75.0}}
    crop-growth:
      enabled: true
      levels: {1: {price: 500000.0, bonus: 30.0}, 2: {price: 1600000.0, bonus: 60.0}, 3: {price: 5120000.0, bonus: 90.0}, 4: {price: 16384000.0, bonus: 120.0}, 5: {price: 52428800.0, bonus: 150.0}}
    mob-xp:
      enabled: true
      levels: {1: {price: 750000.0, bonus: 20.0}, 2: {price: 2550000.0, bonus: 40.0}, 3: {price: 8670000.0, bonus: 60.0}, 4: {price: 29478000.0, bonus: 80.0}, 5: {price: 100225200.0, bonus: 100.0}}
    # Unlike every other upgrade here, "bonus" is an absolute TNT capacity
    # rather than a percentage -- each level states the faction's full TNT
    # bank size outright, so capacities are read straight off this file
    # instead of being derived from a multiplier.
    tnt-bank:
      enabled: true
      levels: {1: {price: 25000000.0, bonus: 2000000.0}, 2: {price: 75000000.0, bonus: 4000000.0}, 3: {price: 200000000.0, bonus: 6000000.0}, 4: {price: 500000000.0, bonus: 8000000.0}, 5: {price: 1000000000.0, bonus: 10000000.0}}
    # `bonus` is the total additional Shield duration in seconds at that level.
    shield-duration:
      enabled: true
      levels: {1: {price: 10000000.0, bonus: 3600.0}, 2: {price: 30000000.0, bonus: 7200.0}, 3: {price: 75000000.0, bonus: 10800.0}, 4: {price: 150000000.0, bonus: 14400.0}, 5: {price: 300000000.0, bonus: 21600.0}}
    # Bonus is the total number of usable rows, not an automatic multiplier.
    vault-rows:
      enabled: true
      levels: {1: {price: 5000000.0, bonus: 2.0}, 2: {price: 15000000.0, bonus: 3.0}, 3: {price: 40000000.0, bonus: 4.0}, 4: {price: 100000000.0, bonus: 5.0}, 5: {price: 250000000.0, bonus: 6.0}}
    # Bonus is the total unlocked Base Claim slot count. Slot 1 is always available.
    base-claim-slots:
      enabled: true
      levels: {1: {price: 50000000.0, bonus: 2.0}, 2: {price: 150000000.0, bonus: 3.0}}

faction-vault:
  # A renewable database lease prevents two shards from editing the same
  # faction vault at once. Values below 10 seconds are clamped to 10.
  lease-seconds: 20
  blacklist:
    materials: [SPAWNER]
    # Exact namespaced PDC keys, for example vertex:f_power_booster.
    pdc-keys: []

