# ============================================
# CUSTOM ENCHANTMENTS -- LIVE RUNE EFFECTS
# ============================================
# effect is a built-in Rune effect. priority resolves effects sharing a
# trigger; higher runs first. Per-level effect-settings are numeric and fully
# configurable without Java changes. Sky Stepper intentionally outranks Dasher.

enchants:
  ore_sense:
    display-name: "Ore Sense"
    description: "Chance to duplicate mined ore drops"
    compatible-types: [PICKAXE]
    effect: ORE_FORTUNE
    levels:
      1: { material: COAL, proc-chance: 100, success-rate: 75, ability-value: 8 }
      2: { material: COAL_BLOCK, proc-chance: 100, success-rate: 60, ability-value: 14 }
      3: { material: IRON_INGOT, glow: true, proc-chance: 100, success-rate: 45, ability-value: 20 }

  crop_bounty:
    display-name: "Crop Bounty"
    description: "Chance to duplicate harvested crops"
    compatible-types: [HOE]
    effect: CROP_BOUNTY
    levels:
      1: { material: WHEAT, proc-chance: 100, success-rate: 75, ability-value: 10 }
      2: { material: HAY_BLOCK, proc-chance: 100, success-rate: 60, ability-value: 17 }
      3: { material: GOLDEN_HOE, glow: true, proc-chance: 100, success-rate: 45, ability-value: 25 }

  featherbound:
    display-name: "Featherbound"
    description: "Reduces fall damage"
    compatible-types: [BOOTS]
    effect: FALL_REDUCTION
    levels:
      1: { material: FEATHER, proc-chance: 100, success-rate: 75, ability-value: 12 }
      2: { material: RABBIT_FOOT, proc-chance: 100, success-rate: 60, ability-value: 20 }
      3: { material: PHANTOM_MEMBRANE, glow: true, proc-chance: 100, success-rate: 45, ability-value: 30 }

  ironhide:
    display-name: "Ironhide"
    description: "Reduces all incoming damage"
    compatible-types: [CHESTPLATE]
    effect: DAMAGE_REDUCTION
    levels:
      1: { material: IRON_INGOT, proc-chance: 100, success-rate: 75, ability-value: 2 }
      2: { material: IRON_BLOCK, proc-chance: 100, success-rate: 60, ability-value: 3 }
      3: { material: ANVIL, glow: true, proc-chance: 100, success-rate: 45, ability-value: 4 }

  scholars_mark:
    display-name: "Scholar's Mark"
    description: "Grants bonus XP from mob kills"
    compatible-types: [SWORD]
    effect: XP_BONUS
    levels:
      1: { material: BOOK, proc-chance: 100, success-rate: 75, ability-value: 8 }
      2: { material: ENCHANTED_BOOK, proc-chance: 100, success-rate: 60, ability-value: 14 }
      3: { material: EXPERIENCE_BOTTLE, glow: true, proc-chance: 100, success-rate: 45, ability-value: 20 }

  sky_stepper:
    display-name: "Sky Stepper"
    description: "Crouch in the air to launch upward"
    compatible-types: [BOOTS]
    effect: SKY_STEPPER
    priority: 200
    blocked-in-combat: true
    levels:
      1:
        material: LIGHT_BLUE_DYE
        proc-chance: 100
        success-rate: 70
        ability-value: 0.8
        effect-settings: { upward-velocity: 0.8, forward-velocity: 0.15, cooldown-seconds: 17 }
      2:
        material: DIAMOND
        proc-chance: 100
        success-rate: 55
        ability-value: 1.0
        effect-settings: { upward-velocity: 1.0, forward-velocity: 0.20, cooldown-seconds: 13 }
      3:
        material: ELYTRA
        glow: true
        proc-chance: 100
        success-rate: 40
        ability-value: 1.2
        effect-settings: { upward-velocity: 1.2, forward-velocity: 0.25, cooldown-seconds: 9 }

  dasher:
    display-name: "Dasher"
    description: "Crouch in the air to launch forward"
    compatible-types: [BOOTS]
    effect: DASHER
    priority: 100
    blocked-in-combat: true
    levels:
      1:
        material: SUGAR
        proc-chance: 100
