# ============================================
# CUSTOM ENCHANTMENTS -- ENCHANT DEFINITIONS
# ============================================
# One entry per custom enchant, each with its own independently configured
# levels. Rolling odds are NOT configured here -- see runes.yml, which
# lists which (enchant, level) combos are on each Rune tier's table and
# their weights. This file only controls what an enchant IS and DOES once
# rolled: its physical-item cosmetics, its compatible gear, its world
# restriction, and every level's proc chance / application success rate /
# ability value.
#
# compatible-types accepts named groups (ALL, PICKAXE, AXE, SHOVEL, HOE,
# SWORD, BOW, TOOL, HELMET, CHESTPLATE, LEGGINGS, BOOTS, ARMOR) and/or
# explicit vanilla Material names, freely mixed.
#
# enabled-worlds / disabled-worlds: enabled-worlds is a whitelist when
# non-empty (only those worlds are active); otherwise disabled-worlds is a
# blacklist. Leaving both empty means the enchant is active everywhere.
# Either way the enchant always stays visible on the item and its data is
# never touched -- a restricted world just makes it provide no effect.
#
# `description` is the ability label shown on an identified Rune before its
# configured level value. Vertex standardizes all identified Rune and applied
# equipment lore; level `name` and `lore` fields from older configs are no
# longer used.
enchants:
  haste_pickaxe:
    display-name: "Haste"
    description: "Mining Speed"
    compatible-types: [PICKAXE]
    enabled-worlds: []
    disabled-worlds: []
    levels:
      1:
        material: COAL
        glow: false
        proc-chance: 25.0
        success-rate: 70.0
        ability-value: 5.0
      2:
        material: COAL_BLOCK
        glow: false
        proc-chance: 20.0
        success-rate: 55.0
        ability-value: 10.0
      3:
        material: DIAMOND
        glow: true
        proc-chance: 15.0
        success-rate: 40.0
        ability-value: 15.0
      4:
        material: NETHERITE_INGOT
        glow: true
        proc-chance: 10.0
        success-rate: 25.0
        ability-value: 20.0

  sharpened_edge:
    display-name: "Sharpened Edge"
    description: "Bonus Damage"
    compatible-types: [SWORD]
    enabled-worlds: []
    disabled-worlds: []
    levels:
      1:
        material: FLINT
        glow: false
        proc-chance: 25.0
        success-rate: 70.0
        ability-value: 1.0
      2:
        material: IRON_INGOT
        glow: false
        proc-chance: 20.0
        success-rate: 55.0
        ability-value: 2.0
      3:
        material: DIAMOND
        glow: true
        proc-chance: 15.0
        success-rate: 40.0
        ability-value: 3.0
      4:
        material: NETHERITE_INGOT
        glow: true
        proc-chance: 10.0
        success-rate: 25.0
        ability-value: 4.0
