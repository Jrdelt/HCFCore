      2: { material: BLAZE_ROD, proc-chance: 30, success-rate: 55, ability-value: 3, effect-settings: { fire-seconds: 3 } }
      3: { material: MAGMA_CREAM, glow: true, proc-chance: 35, success-rate: 40, ability-value: 4, effect-settings: { fire-seconds: 4 } }

  windrunner:
