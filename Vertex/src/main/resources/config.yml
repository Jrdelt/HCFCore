# ============================================
# Vertex Configuration
# ============================================
# This config file controls all core gameplay settings.
# See README.md for detailed explanations of each option.

# ============================================
# LOCALIZATION
# ============================================
language:
  # Default language for new players. Supported: en_us, es_us, pt_br, de_de
  default: en_us

# ============================================
# STORAGE
# ============================================
storage:
  # Where player/kit/ability/spawner/collector/blueprint data is saved.
  #   local - a single SQLite file (vertex.db) in this plugin's data
  #           folder. Zero setup, works immediately, best for a single
  #           server. This is the default -- leave this section alone
  #           (or set it to anything other than exactly "mysql") to use it.
  #   mysql - a MySQL/MariaDB server, configured in the "mysql" section
  #           below. Only needed if multiple servers must share this
  #           plugin's data (e.g. a proxied network), or you already run
  #           a MySQL server and prefer to keep everything there.
  type: local

# ============================================
# DATABASE (MySQL/MariaDB) -- only used when storage.type is "mysql"
# ============================================
mysql:
  # Connection details
  host: localhost
  port: 3306
  database: vertex
  username: root
  password: ''

  # Connection pool settings
  pool-size: 10  # Number of concurrent database connections

  # Security options
  allow-public-key-retrieval: true  # Required for caching_sha2_password without SSL
  use-ssl: false  # Set to true if using SSL certificates

# ============================================
# CHAT FORMATTING
# Chat format components (use MiniMessage or legacy & color codes).
# rank-format also supports {rank}, {prefix}, or a PlaceholderAPI
# %placeholder% token like %luckperms_prefix% (needs PlaceholderAPI).
# Separator between message components
# ============================================
chat:
  separator: ' <gray>»</gray>'
  faction-format: '&8[<gray>{faction}</gray>&8] '
  rank-format: '%luckperms_prefix%'
  name-format: '{name} '

# ============================================
# ITEM RESTRICTIONS
# ============================================
item-restrictions:
  # Items that cannot be used or swapped into the offhand. This replaces the
  # old blanket offhand lock, so Backpacks and every other allowed item can
  # now use the offhand normally.
  disabled-items:
    - SHIELD

  # Crafted recipe results that should be blocked. Use Bukkit material names.
  # This applies to both the 2x2 inventory grid and crafting tables.
  disabled-crafting-results:
    - SHIELD

# ============================================
# PVP MECHANICS
# ============================================
pvp:
  # Combat tag duration in seconds
  combat-tag-seconds: 30

  # After landing a kill, the killer's own combat tag drops to this many
  # seconds instead of running out the full combat-tag-seconds duration --
  # lets them loot the body/retreat without being stuck in combat.
  post-kill-combat-seconds: 5

  # PvP death drops are collectible by the killer only for this long.
  # Set seconds to 0 or enabled to false to disable protection.
  loot-protection:
    enabled: true
    seconds: 20

  # Item cooldowns (in seconds)
  pearl-cooldown-seconds: 12
  golden-apple-cooldown-seconds: 8
  enchanted-golden-apple-cooldown-seconds: 120

  # A thrown ender pearl landing in one of these WorldGuard regions, or a
  # claim named this (case-insensitive), is cancelled outright -- stops
  # pearling into spawn/safezone to escape combat. Time Warp Pearl checks
  # its recorded origin against this too, so a pearl thrown out of spawn
  # long before a fight can't become an anytime recall-to-safety button.
  no-pearl-regions:
    - spawn
  no-pearl-claim-names:
    - safezone

  # Same zones as no-pearl-regions/no-pearl-claim-names above, but for
  # plain walking and non-pearl teleports (commands, /f home, other
  # plugins): a combat-tagged player can't cross into one at all -- not
  # just pearl into it -- so combat can't be escaped by simply walking
  # back to safety. Only applies while actually tagged; untagged players
  # move freely. vertex.combat.safezone.bypass (default op) skips this,
  # for staff moderation.
  combat-blocks-safezone-entry: true

  # Extra velocity on a thrown ender pearl, but only while actively falling
  # or aiming downward -- a flat/upward throw is untouched, so this can't
  # be used to snipe someone from across the map.
  pearl-velocity-multiplier: 1.35

  # Worlds where hunger never changes at all (players don't need to eat).
  disable-hunger-worlds: [world]

  # Logout penalty: if true, disconnecting while tagged counts as combat logout
  logout-penalty: true

  # Optional combat-log villagers. When enabled, an eligible player who is
  # kicked or force-disconnected is represented by a killable Villager
  # instead of being killed immediately. Voluntary logouts are never given
  # and receive the normal combat-logout penalty. This is a native Vertex
  # feature and does not require an NPC plugin.
  ghost-players:
    enabled: false
    # If true, only players with an active Vertex combat tag leave a ghost.
    # Set false to allow every forced disconnect in allowed worlds.
    combat-tagged-only: true
    # Empty means every world. World names are case-insensitive.
    allowed-worlds: []
    # Remove an untouched ghost after this many seconds. 0 means never.
    # Its saved inventory is restored when the owner next joins.
    despawn-after-seconds: 300

  # Commands blocked while tagged into combat (case-insensitive, without
  # the leading "/"). An entry with more than one word only blocks that
  # exact subcommand -- "f home" blocks "/f home" but not the rest of "/f";
  # a single word like "kit" blocks that whole command tree. List every
  # alias you use separately (e.g. both "f home" and "factions home") --
  # this only matches what the player actually typed.
  blocked-commands-in-combat:
      # Inventory & Kits
      - kit
      - kits
      - abilities
      - pv
      - playervault
      - playervaults
      - vault
      - ec
      - enderchest
      - craft
      - workbench
      - anvil
      # Teleportation & Escapes
      - f home
      - factions home
      - spawn
      - warp
      - warps
      - tpa
      - tpaccept
      - tpahere
      - back
      - wild
      - rtp
      # Economy & Trading
      - ah
      - auctionhouse
      - shop
      - buy
      - sell
      - trade
      - pay
      # Cheats, Perks & Utility
      - fly
      - god
      - heal
      - feed
      - repair
      - fix
      - suicide
      # Faction Exploit Prevention
      - f leave
      - factions leave
      - f disband
      - factions disband
      - f kick
      - factions kick

  # How often to update the combat action bar (ticks)
  actionbar-update-interval-ticks: 2

  # Combat action bar templates (MiniMessage). {seconds} and {health} are
  # pre-colored (countdown is always green, health is always red) --
  # everything else in the template is yours to style freely.
  # Placeholders:
  #   {seconds}    remaining combat time, e.g. "(12s)"
  #   {health}     opponent's health, e.g. "❤ 14"
  #   {opponent}   opponent's name
  #   {your_cps}   your clicks per second
  #   {their_cps}  opponent's clicks per second
  actionbar:
    # Tagged against "the server" (no live opponent -- e.g. after a combat logout)
    vs-server: '<gray>Combat<gray>: <red>server <gray>{seconds} <green>you <white>({your_cps}cps)'
    # Tagged against another online player
    vs-player: '<red>⚔ <gray>Combat<gray>: <red>{opponent} <gray>(<green>{health}<gray>) <gray>Ends: <green>{seconds} <gray>CPS: <green>You: <gray>(<green>{your_cps}<gray>) <red>Them <gray>(<red>{their_cps}<gray>) <red>⚔'    # Tagged, but the opponent is offline or otherwise unresolvable
    vs-unknown: '<red><bold>Combat</bold><gray>: {seconds} <green>you <white>({your_cps}cps)'

  # ---- LEGACY COMBAT (1.8 PvP style) ----
  legacy-combat:
    enabled: true
    # Worlds to apply legacy combat (leave empty for all worlds)
    worlds: []
    # Attack speed (higher = faster attacks, removes cooldown bar)
    attack-speed: 1024.0
    # Remove sweeping damage from axes
    disable-sweeping-attacks: true

    # --- WEAPONS & ARMOR ---
    # Overrides a weapon's base attack damage with the value below instead
    # of the modern attribute-based amount. A material left out of the
    # table keeps its normal damage. Enchantments/potion effects/armor
    # still apply normally on top of this.
    legacy-weapon-damage: true
    weapon-damage:
      WOODEN_SWORD: 4.0
      GOLDEN_SWORD: 4.0
      STONE_SWORD: 5.0
      IRON_SWORD: 6.0
      DIAMOND_SWORD: 8.0
      NETHERITE_SWORD: 8.0
      WOODEN_AXE: 5.0
      GOLDEN_AXE: 5.0
      STONE_AXE: 6.0
      IRON_AXE: 6.0
      DIAMOND_AXE: 6.0
      NETHERITE_AXE: 6.0
    # Cancels out the armor toughness modern armor pieces carry (the
    # mechanic that gives diminishing returns against big hits), so armor
    # reduction goes back to being a flat, predictable percentage.
    legacy-armor-calculations: true
    # --- KNOCKBACK & PROJECTILES ---
    # Restores the pre-1.9 behavior of snowball/egg/fishing-rod hits
    # pushing the target even though they deal no damage.
    projectile-knockback:
      fishing-rod: true
      snowball: true
      egg: true
    # Knockback applied on every melee hit and every enabled projectile hit
    # above, overriding vanilla's own knockback entirely.
    knockback:
      horizontal: 0.275
      vertical: 0.15
      # Extra horizontal knockback when the attacker is sprinting.
      sprint-bonus: 0.1

    # --- HEALTH & REGEN ---
    # Replaces vanilla's fast, food-saturation-boosted regen with a flat
    # 1 heart every 4 seconds (still gated on food level >= 18, same as
    # vanilla's own natural-regen requirement).
    legacy-health-regen: true
    # Replaces vanilla's golden apple/enchanted golden apple effects
    # entirely with these lists (each entry: type, amplifier, duration in
    # seconds). Leave a list empty to fall back to doing nothing special
    # for that apple (vanilla's own effects still apply in that case).
    legacy-golden-apples: true
    golden-apple-effects:
      - type: REGENERATION
        amplifier: 1
        duration-seconds: 5
      - type: ABSORPTION
        amplifier: 0
        duration-seconds: 120
    enchanted-golden-apple-effects:
      - type: REGENERATION
        amplifier: 1
        duration-seconds: 20
      - type: ABSORPTION
        amplifier: 3
        duration-seconds: 120
      - type: FIRE_RESISTANCE
        amplifier: 0
        duration-seconds: 300
      - type: RESISTANCE
        amplifier: 0
        duration-seconds: 300

# ============================================
# FACTIONS
# ============================================
factions:
  # Prevent faction leaders from using /f leave
  prevent-leader-leave: true

  # Command aliases for /factions
  command-aliases:
    - f
    - factions
    - t

# ============================================
# FACTION UPGRADES
# ============================================
# `/f upgrades` (or `/f upgrade`) opens Vertex's persistent purchase GUI for
# roles allowed FactionsUUID's native UPGRADE action. Costs are withdrawn from
# the clicking member through Vault. Each level has its own explicit price and
# total bonus, so no multiplier is applied. Set a level's price to 0 for a
# free level. Player effects require the member to be in their own claim;
# Spawner Rate and Crop Growth apply to managed blocks/crops in that claim.
# Warps is the native FactionsUUID bridge: its `bonus` is display-only because
# FactionsUUID controls the number of allowed warps. Keep matching native
# FactionsUUID upgrades disabled unless you deliberately want effects to stack.
faction-upgrades:
  enabled: true
  # With the native UPGRADE action allowed, members may view and buy upgrades.
  leader-only: false
  # TNT bank size for a faction that has not bought the tnt-bank upgrade.
  # Each purchased level below replaces this with its own absolute capacity.
  tnt-base-capacity: 1000000
  upgrades:
    claim-damage:
      enabled: true
      levels: {1: {price: 50000.0, bonus: 5.0}, 2: {price: 87500.0, bonus: 10.0}, 3: {price: 153125.0, bonus: 15.0}, 4: {price: 267969.0, bonus: 20.0}, 5: {price: 468945.0, bonus: 25.0}}
    claim-protection:
      enabled: true
      levels: {1: {price: 60000.0, bonus: 4.0}, 2: {price: 105000.0, bonus: 8.0}, 3: {price: 183750.0, bonus: 12.0}, 4: {price: 321563.0, bonus: 16.0}, 5: {price: 562734.0, bonus: 20.0}}
    armor-wear:
      enabled: true
      levels: {1: {price: 40000.0, bonus: 10.0}, 2: {price: 68000.0, bonus: 20.0}, 3: {price: 115600.0, bonus: 30.0}, 4: {price: 196520.0, bonus: 40.0}, 5: {price: 334084.0, bonus: 50.0}}
    fall-protection:
      enabled: true
      levels: {1: {price: 1000000.0, bonus: 10.0}}
    fly-boost:
      enabled: true
      levels: {1: {price: 50000.0, bonus: 20.0}, 2: {price: 250000.0, bonus: 40.0}, 3: {price: 1250000.0, bonus: 60.0}, 4: {price: 6250000.0, bonus: 80.0}, 5: {price: 31250000.0, bonus: 100.0}}
    # This sets FactionsUUID's native Warps upgrade level. Configure matching
    # maximum levels and complete warp-count values in FactionsUUID's upgrade
    # configuration; Vertex's price/bonus controls only its own GUI.
    warps:
      enabled: true
      levels: {1: {price: 500000.0, bonus: 1.0}, 2: {price: 1000000.0, bonus: 2.0}, 3: {price: 2000000.0, bonus: 3.0}, 4: {price: 4000000.0, bonus: 4.0}, 5: {price: 8000000.0, bonus: 5.0}, 6: {price: 16000000.0, bonus: 6.0}, 7: {price: 32000000.0, bonus: 7.0}, 8: {price: 64000000.0, bonus: 8.0}, 9: {price: 128000000.0, bonus: 9.0}, 10: {price: 256000000.0, bonus: 10.0}, 11: {price: 512000000.0, bonus: 11.0}, 12: {price: 1000000000.0, bonus: 12.0}, 13: {price: 1000000000.0, bonus: 13.0}, 14: {price: 1000000000.0, bonus: 14.0}, 15: {price: 1000000000.0, bonus: 15.0}}
    spawner-rate:
      enabled: true
      levels: {1: {price: 10000000.0, bonus: 15.0}, 2: {price: 50000000.0, bonus: 30.0}, 3: {price: 250000000.0, bonus: 45.0}, 4: {price: 1000000000.0, bonus: 60.0}, 5: {price: 1000000000.0, bonus: 75.0}}
    crop-growth:
      enabled: true
      levels: {1: {price: 500000.0, bonus: 30.0}, 2: {price: 1600000.0, bonus: 60.0}, 3: {price: 5120000.0, bonus: 90.0}, 4: {price: 16384000.0, bonus: 120.0}, 5: {price: 52428800.0, bonus: 150.0}}
    mob-xp:
      enabled: true
      levels: {1: {price: 750000.0, bonus: 20.0}, 2: {price: 2550000.0, bonus: 40.0}, 3: {price: 8670000.0, bonus: 60.0}, 4: {price: 29478000.0, bonus: 80.0}, 5: {price: 100225200.0, bonus: 100.0}}
    # Unlike every other upgrade here, "bonus" is an absolute TNT capacity
    # rather than a percentage -- each level states the faction's full TNT
    # bank size outright, so capacities are read straight off this file
    # instead of being derived from a multiplier.
    tnt-bank:
      enabled: true
      levels: {1: {price: 25000000.0, bonus: 2000000.0}, 2: {price: 75000000.0, bonus: 4000000.0}, 3: {price: 200000000.0, bonus: 6000000.0}, 4: {price: 500000000.0, bonus: 8000000.0}, 5: {price: 1000000000.0, bonus: 10000000.0}}

rally:
  # Live player position/yaw interval for the faction-rally direction bar.
  direction-update-ticks: 10
  # Faction leaders open the complete permission matrix with /f permissions
  # or /f perms. Left-click allows and right-click denies. FactionsUUID saves
  # its built-in actions; this section supplies Vertex-specific actions.
  # Permission states always use green/red stained-glass panes, so that an
  # allowed action can never look blocked because of a custom item material.
  permission-gui:
    title: '<gold>Faction Permissions'
    roles:
      mod: {slot: 2, material: DIAMOND_SWORD, name: '<blue>Moderator', rally-set: true, rally-clear: true, spawner-add: true, spawner-remove: true, collector-open: true, collector-break: true, bank-deposit: true, bank-withdraw: true}
      member: {slot: 4, material: GOLDEN_SWORD, name: '<yellow>Member', rally-set: true, rally-clear: true, spawner-add: true, spawner-remove: true, collector-open: true, collector-break: true, bank-deposit: true, bank-withdraw: true}
      recruit: {slot: 6, material: WOODEN_SWORD, name: '<gray>Recruit', rally-set: true, rally-clear: true, spawner-add: true, spawner-remove: true, collector-open: true, collector-break: true, bank-deposit: true, bank-withdraw: true}
    actions:
      vertex-rally-set: {name: 'Set Rally'}
      vertex-rally-clear: {name: 'Clear Rally'}
      vertex-bank-deposit: {name: 'Deposit Bank Resources'}
      vertex-bank-withdraw: {name: 'Withdraw Bank Resources'}
      # Add a FactionsUUID action here to customize its label. Example:
      # build: {name: 'Build'}

# ============================================
# KITS
# ============================================
kits:
  # Default kit cooldown in seconds
  default-cooldown-seconds: 30
  # Delay before class effects apply after putting on full armor
  effect-warmup-seconds: 7
  # Maximum cooldown allowed (about 1 day)
  max-cooldown-seconds: 43200
  # Maximum money cost for a kit
  max-money-cost: 1000000000.0
  # Maximum item cost amount
  max-cost-item-amount: 64

# ============================================
# ABILITIES
# ============================================
abilities:
  # Cooldown shared across all ability items
  global-cooldown-seconds: 3
  # Maximum number of items /getitem can give
  max-getitem-amount: 64
  # Portable Bard's buff items only reach faction members within this many
  # blocks of the caster (same world), not the whole online faction.
  bard-share-radius-blocks: 30
  # Regions where abilities are disabled (e.g., spawn, safezone)
  # Per-ability settings (cooldowns, durations) go in abilities.yml
  disabled-regions:
    - spawn
  # Faction claim names abilities are disabled in -- abilities work
  # everywhere else (wilderness and any other faction's claimed land),
  # this is only a blocklist. Matches the faction's tag/name
  # case-insensitively, including the system SafeZone/WarZone factions
  # (set via /f safezone, /f warzone) if you've named them this way.
  disabled-claim-names:
    - safezone

# ============================================
# SAND BOTS
# Give with /sandbot give <player>. The Bot may be placed on any block in
# its owner's faction claim. It fills columns beneath nearby anchors in its
# flat radius: andesite -> gravel, sandstone -> sand, red sandstone -> red
# sand, and colored concrete -> matching concrete powder. Anchors remain;
# each column can receive multiple falling blocks per tick until its stack
# reaches the anchor. Every block is paid from native faction money, then /fbank.
# ============================================
sandbot:
  enabled: true

  # How many blocks in each direction from the placement point the bot
  # operates across (2 = a 5x5 footprint). Capped at 5 regardless of this
  # value.
  radius-blocks: 2

  # How often the bot attempts a conversion pass (in ticks; 20 = 1 second).
  tick-interval-ticks: 1

  # Maximum new falling blocks for each anchor column in one conversion pass.
  placements-per-column-per-tick: 2

  # Global safety cap across one Sand Bot in one conversion pass. A radius of
  # 2 has at most 25 columns, so 50 permits the two-per-column default.
  max-placements-per-tick: 50

# ============================================
# TNT FILL
# /tntfill <radius> <amount> <bank|inventory> tops up every dispenser
# within radius blocks of the player, drawing TNT from either
# FactionsUUID's own native TNT bank (the same balance /f tnt,
# /f tntdeposit, and /f tntwithdraw manage -- Vertex doesn't keep a
# second, separate TNT ledger) or the player's own inventory. Only
# dispensers inside the player's own faction's claimed land count.
# ============================================
tntfill:
  enabled: true

  # Hard-capped at 100 in code regardless of this value.
  max-radius: 7511

# ============================================
# REBOOT SYSTEM
# ============================================
reboot:
  # Default countdown length for /reboot
  default-delay-minutes: 10

  # When to announce reminders before shutdown
  reminder-minutes:
    - 10
    - 5
    - 1

  # ---- ARCHER CLASS ----
  # Archers mark victims with arrows. Each stack increases arrow damage and gives
  # the archer's faction a melee bonus against the marked player.
  archer-tag:
    # How long a mark lasts (refreshed by each new arrow)
    duration-seconds: 8
    # Maximum number of stacks from multiple archers
    max-stacks: 3
    # Arrow damage multiplier per stack (0.10 = +10% per stack)
    arrow-damage-bonus-per-stack: 0.02175
    # Melee damage bonus for the archer's faction only
    faction-melee-bonus-per-stack: 0.025
    # Chat messages when a mark is applied (MiniMessage). Placeholders:
    # {player}, {percent} (arrow bonus), {melee} (faction melee bonus),
    # {seconds} (mark duration).
    message-attacker: '&c&lKITS&r &7> <gold>Tagged {player} <gray>(+{percent}%, {seconds}s)'
    message-victim: '&c&lKITS&r &7> <red>Tagged by {player} <gray>(+{percent}%, {seconds}s)'
