# ============================================
# HCFCore Configuration
# ============================================
# This config file controls all core gameplay settings.
# See README.md for detailed explanations of each option.

# ============================================
# LOCALIZATION
# ============================================
language:
  # Default language for new players. Supported: en_us, es_us, pt_br, de_de
  default: en_us

# ============================================
# DATABASE (MySQL/MariaDB)
# ============================================
mysql:
  # Connection details
  host: localhost
  port: 3306
  database: hcfcore
  username: root
  password: ''

  # Connection pool settings
  pool-size: 10  # Number of concurrent database connections

  # Security options
  allow-public-key-retrieval: true  # Required for caching_sha2_password without SSL
  use-ssl: false  # Set to true if using SSL certificates

# ============================================
# SCOREBOARD
# ============================================
scoreboard:
  # How often to update the scoreboard (in ticks; 20 ticks = 1 second)
  update-interval-ticks: 20

  # Scoreboard title with placeholders
  title: '<blue><bold>ꜰᴀᴄᴛɪᴏɴꜱ<reset>   <gray>{date}'

  # Date format shown in title
  date-format: 'MM/dd'

  # Scoreboard content lines
  # Supports: {name}, {rank_prefix}, {rank}, {prefix}, {exp}, {balance}, {faction}, {power}, {fplayers_online}, {ftop}
  # Also supports PlaceholderAPI %placeholder% tokens (e.g. %luckperms_prefix%) if PlaceholderAPI is installed.
  lines:
    - '     <gray>Season I'
    - '   %luckperms_prefix%<gray>{name}'
    - '<gray>• <red>Experience: <white>{exp}'
    - '<gray>• <red>Balance: <white>{balance}'
    - ''
    - '<white>{faction} <gray>[<yellow>#{ftop}<gray>]'
    - '<gray> <red>• Power: <white>{power}'
    - '<gray> <red>• Online: <white>{fplayers_online}'
    - ''
    - '<gray>hub.mc-vertex.com'

# ============================================
# CHAT FORMATTING
# ============================================
chat:
  # Separator between message components
  separator: ' <gray>» </gray>'

  # Chat format components (use MiniMessage or legacy & color codes).
  # rank-format also supports {rank}, {prefix}, or a PlaceholderAPI
  # %placeholder% token like %luckperms_prefix% (needs PlaceholderAPI).
  faction-format: '&8[<gray>{faction}</gray>&8] '
  rank-format: '%luckperms_prefix% '
  name-format: '{name} '

# ============================================
# PVP MECHANICS
# ============================================
pvp:
  # Combat tag duration in seconds
  combat-tag-seconds: 30

  # Item cooldowns (in seconds)
  pearl-cooldown-seconds: 12
  golden-apple-cooldown-seconds: 8
  enchanted-golden-apple-cooldown-seconds: 120

  # Logout penalty: if true, disconnecting while tagged counts as combat logout
  logout-penalty: true

  # How often to update the combat action bar (ticks)
  actionbar-update-interval-ticks: 2

  # Combat action bar templates (MiniMessage). {seconds} and {health} are
  # pre-colored (countdown fades red->green, health is always red) --
  # everything else in the template is yours to style freely.
  # Placeholders:
  #   {seconds}    remaining combat time, e.g. "(12s)"
  #   {health}     opponent's health, e.g. "❤ 14"
  #   {opponent}   opponent's name
  #   {your_cps}   your clicks per second
  #   {their_cps}  opponent's clicks per second
  actionbar:
    # Tagged against "the server" (no live opponent -- e.g. after a combat logout)
    vs-server: '<gray>Combat<gray>: <red>server <gray>{seconds} <green>you <white>({your_cps}cps)'
    # Tagged against another online player
    vs-player: '<red>⚔ <gray>Combat<gray>: <red>{opponent} <gray>(<green>{health}<gray>) <gray>Ends: <green>{seconds} <gray>CPS: <green>You: <gray>(<green>{your_cps}<gray>) <red>Them <gray>(<red>{their_cps}<gray>) <red>⚔'    # Tagged, but the opponent is offline or otherwise unresolvable
    vs-unknown: '<red><bold>Combat</bold><gray>: {seconds} <green>you <white>({your_cps}cps)'

  # ---- ARCHER CLASS ----
  # Archers mark victims with arrows. Each stack increases arrow damage and gives
  # the archer's faction a melee bonus against the marked player.
  archer-tag:
    # How long a mark lasts (refreshed by each new arrow)
    duration-seconds: 10
    # Maximum number of stacks from multiple archers
    max-stacks: 4
    # Arrow damage multiplier per stack (0.15 = +15% per stack)
    arrow-damage-bonus-per-stack: 0.15
    # Melee damage bonus for the archer's faction only
    faction-melee-bonus-per-stack: 0.05

  # ---- LEGACY COMBAT (1.8 PvP style) ----
  legacy-combat:
    enabled: true
    # Worlds to apply legacy combat (leave empty for all worlds)
    worlds: []
    # Attack speed (higher = faster attacks, removes cooldown bar)
    attack-speed: 1024.0
    # Remove sweeping damage from axes
    disable-sweeping-attacks: true

# ============================================
# FACTIONS
# ============================================
factions:
  # Prevent faction leaders from using /f leave
  prevent-leader-leave: true

  # Command aliases for /factions
  command-aliases:
    - f
    - factions

# ============================================
# KITS
# ============================================
kits:
  # Default kit cooldown in seconds
  default-cooldown-seconds: 30

  # Delay before class effects apply after putting on full armor
  effect-warmup-seconds: 5

  # Maximum cooldown allowed (about 1 day)
  max-cooldown-seconds: 86400

  # Maximum money cost for a kit
  max-money-cost: 1000000000.0

  # Maximum item cost amount
  max-cost-item-amount: 64

# ============================================
# ABILITIES
# ============================================
abilities:
  # Cooldown shared across all ability items
  global-cooldown-seconds: 4

  # Maximum number of items /getitem can give
  max-getitem-amount: 64

  # Regions where abilities are disabled (e.g., spawn, safezone)
  # Per-ability settings (cooldowns, durations) go in abilities.yml
  disabled-regions:
    - spawn

  # Faction claim names abilities are disabled in -- abilities work
  # everywhere else (wilderness and any other faction's claimed land),
  # this is only a blocklist. Matches the faction's tag/name
  # case-insensitively, including the system SafeZone/WarZone factions
  # (set via /f safezone, /f warzone) if you've named them this way.
  disabled-claim-names:
    - safezone

# ============================================
# NAMETAGS
# ============================================
nametags:
  # Enable/disable nametags above player heads
  enabled: true

  # How often to update nametags (in ticks; 20 ticks = 1 second)
  update-interval-ticks: 20

  # Nametag format is fixed: &8[&a<ftop>&8] &8[<color>(faction)&8] &e<player>
  # Note: nametags use a shared scoreboard team, so the faction-name color
  # below is the SAME for every viewer -- Minecraft's scoreboard API has no
  # per-viewer color, so true "red to enemies, purple to allies" coloring
  # would require a packet library (e.g. ProtocolLib) and isn't implemented.
  colors:
    same-faction: 'green'      # Players in a faction
    neutral: 'gray'            # Factionless players

# ============================================
# REBOOT SYSTEM
# ============================================
reboot:
  # Default countdown length for /reboot
  default-delay-minutes: 10

  # When to announce reminders before shutdown
  reminder-minutes:
    - 10
    - 5
    - 1
