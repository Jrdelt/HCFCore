language:
  default: en_us

mysql:
  host: localhost
  port: 3306
  database: hcfcore
  username: root
  password: ''
  pool-size: 10
  # Required for local MySQL servers using caching_sha2_password without SSL.
  allow-public-key-retrieval: true
  # Set true for a MySQL server configured with SSL certificates.
  use-ssl: false

scoreboard:
  update-interval-ticks: 20
  title: '<blue><bold>ꜰᴀᴄᴛɪᴏɴꜱ<reset>   <gray>{date}'
  date-format: 'MM/dd'
  lines:
    - '     <gray>Season I'
    - '   <gray>{rank_prefix}{name}'
    - '<gray>• <red>Experience: <white>{exp}'
    - '<gray>• <red>Balance: <white>{balance}'
    - ''
    - '<white>{faction} <gray>[<yellow>#{ftop}<gray>]'
    - '<gray> <red>• Power: <white>{power}'
    - '<gray> <red>• Online: <white>{fplayers_online}'
    - ''
    - '<gray>hub.mc-vertex.com'

chat:
  separator: ' <gray>» </gray>'
  faction-format: '<gray>[{faction}]</gray> '
  rank-format: '<gray>[{rank}]</gray> '
  name-format: '{name} '

pvp:
  combat-tag-seconds: 30
  pearl-cooldown-seconds: 12
  golden-apple-cooldown-seconds: 8
  enchanted-golden-apple-cooldown-seconds: 120
  logout-penalty: true
  actionbar-update-interval-ticks: 2
  # Archer tag: an archer's arrows mark the victim, and each stack makes
  # further arrows hurt more. The archer's own faction also gets the
  # (smaller) melee bonus against them; nobody else does.
  archer-tag:
    duration-seconds: 10
    max-stacks: 4
    arrow-damage-bonus-per-stack: 0.15
    faction-melee-bonus-per-stack: 0.05
  legacy-combat:
    enabled: true
    # Empty means every world. Add world names to limit legacy PvP.
    worlds: []
    # High attack speed removes the modern attack cooldown indicator.
    attack-speed: 1024.0
    disable-sweeping-attacks: true

factions:
  prevent-leader-leave: true
  command-aliases:
    - f
    - factions

kits:
  default-cooldown-seconds: 30
  effect-warmup-seconds: 5
  max-cooldown-seconds: 86400
  max-money-cost: 1000000000.0
  max-cost-item-amount: 64

abilities:
  global-cooldown-seconds: 4
  max-getitem-amount: 64
  # Per-ability tuning (durations, multipliers, cooldowns) lives with the
  # ability itself in abilities.yml -- only server-wide limits belong here.
  disabled-regions:
    - spawn

reboot:
  default-delay-minutes: 10
  reminder-minutes:
    - 10
    - 5
    - 1
