language:
  default: en_us

mysql:
  host: localhost
  port: 3306
  database: hcfcore
  username: root
  password: ''
  pool-size: 10
  # Required for local MySQL servers using caching_sha2_password without SSL.
  allow-public-key-retrieval: true
  # Set true for a MySQL server configured with SSL certificates.
  use-ssl: false

scoreboard:
  update-interval-ticks: 20
  title: '<aqua><bold>HCF<white><bold>Core'
  lines:
    - ''
    - '<gray>Online: <white>{online}'
    - '<gray>Faction: <white>{faction}'
    - '<gray>Role: <white>{faction_role}'
    - ''
    - '<gray>play.example.com'
  cooldowns:
    enabled: true
    header: '<light_purple>Cooldowns:'
    line: '<gray>{ability_cooldowns}'

pvp:
  combat-tag-seconds: 30
  logout-penalty: true
  actionbar-update-interval-ticks: 4
  legacy-combat:
    enabled: true
    # Empty means every world. Add world names to limit legacy PvP.
    worlds: []
    # High attack speed removes the modern attack cooldown indicator.
    attack-speed: 1024.0
    disable-sweeping-attacks: true

factions:
  prevent-leader-leave: true
  command-aliases:
    - f
    - factions

kits:
  default-cooldown-seconds: 300

abilities:
  global-cooldown-seconds: 3
  disabled-regions:
    - spawn

reboot:
  default-delay-minutes: 10
  reminder-minutes:
    - 10
    - 5
    - 1
