# ============================================
# HCFCore Configuration
# ============================================
# This config file controls all core gameplay settings.
# See README.md for detailed explanations of each option.

# ============================================
# LOCALIZATION
# ============================================
language:
  # Default language for new players. Supported: en_us, es_us, pt_br, de_de
  default: en_us

# ============================================
# DATABASE (MySQL/MariaDB)
# ============================================
mysql:
  # Connection details
  host: localhost
  port: 3306
  database: hcfcore
  username: root
  password: ''

  # Connection pool settings
  pool-size: 10  # Number of concurrent database connections

  # Security options
  allow-public-key-retrieval: true  # Required for caching_sha2_password without SSL
  use-ssl: false  # Set to true if using SSL certificates

# ============================================
# SCOREBOARD
# ============================================
scoreboard:
  # How often to update the scoreboard (in ticks; 20 ticks = 1 second)
  update-interval-ticks: 15

  # Scoreboard title with placeholders
  title: '<blue><bold>ꜰᴀᴄᴛɪᴏɴꜱ<reset>   <gray>{date}'

  # Date format shown in title
  date-format: 'MM/dd'

  # Scoreboard content lines
  # Supports: {name}, {rank_prefix}, {rank}, {prefix}, {exp}, {balance}, {faction}, {power}, {fplayers_online}, {ftop}
  # Also supports PlaceholderAPI %placeholder% tokens (e.g. %luckperms_prefix%) if PlaceholderAPI is installed.
  lines:
    - '     <gray>ꜱᴇᴀꜱᴏɴ I'
    - '%luckperms_prefix%<gray>{name}'
    - '<gray>• <red>Balance: <white>{balance}'
    - '<gray>• <red>Experience: <white>{exp}'
    - '<gray>• <red>K/D: <white>%kdratio_kills%<gray>:<white>%kdratio_deaths%'
    - ''
    - '<white>{faction} <gray>[<yellow>#{ftop}<gray>]'
    - '<gray> <red>• Power: <white>{power}'
    - '<gray> <red>• Online: <white>{fplayers_online}'
    - ''
    - '<gray>hub.mc-vertex.com'

# ============================================
# CHAT FORMATTING
# Chat format components (use MiniMessage or legacy & color codes).
# rank-format also supports {rank}, {prefix}, or a PlaceholderAPI
# %placeholder% token like %luckperms_prefix% (needs PlaceholderAPI).
# Separator between message components
# ============================================
chat:
  separator: ' <gray>»</gray>'
  faction-format: '&8[<gray>{faction}</gray>&8] '
  rank-format: '%luckperms_prefix%'
  name-format: '{name} '

# ============================================
# PVP MECHANICS
# ============================================
pvp:
  # Combat tag duration in seconds
  combat-tag-seconds: 30

  # After landing a kill, the killer's own combat tag drops to this many
  # seconds instead of running out the full combat-tag-seconds duration --
  # lets them loot the body/retreat without being stuck in combat.
  post-kill-combat-seconds: 5

  # Item cooldowns (in seconds)
  pearl-cooldown-seconds: 12
  golden-apple-cooldown-seconds: 8
  enchanted-golden-apple-cooldown-seconds: 120

  # A thrown ender pearl landing in one of these WorldGuard regions, or a
  # claim named this (case-insensitive), is cancelled outright -- stops
  # pearling into spawn/safezone to escape combat. Time Warp Pearl checks
  # its recorded origin against this too, so a pearl thrown out of spawn
  # long before a fight can't become an anytime recall-to-safety button.
  no-pearl-regions:
    - spawn
  no-pearl-claim-names:
    - safezone

  # Extra velocity on a thrown ender pearl, but only while actively falling
  # or aiming downward -- a flat/upward throw is untouched, so this can't
  # be used to snipe someone from across the map.
  pearl-velocity-multiplier: 1.35

  # Worlds where hunger never changes at all (players don't need to eat).
  disable-hunger-worlds: [world]

  # Logout penalty: if true, disconnecting while tagged counts as combat logout
  logout-penalty: true

  # Commands blocked while tagged into combat (case-insensitive, without
  # the leading "/"). An entry with more than one word only blocks that
  # exact subcommand -- "f home" blocks "/f home" but not the rest of "/f";
  # a single word like "kit" blocks that whole command tree. List every
  # alias you use separately (e.g. both "f home" and "factions home") --
  # this only matches what the player actually typed.
  blocked-commands-in-combat:
      # Inventory & Kits
      - kit
      - kits
      - abilities
      - pv
      - playervault
      - playervaults
      - vault
      - ec
      - enderchest
      - craft
      - workbench
      - anvil
      # Teleportation & Escapes
      - f home
      - factions home
      - spawn
      - warp
      - warps
      - tpa
      - tpaccept
      - tpahere
      - back
      - wild
      - rtp
      # Economy & Trading
      - ah
      - auctionhouse
      - shop
      - buy
      - sell
      - trade
      - pay
      # Cheats, Perks & Utility
      - fly
      - god
      - heal
      - feed
      - repair
      - fix
      - suicide
      # Faction Exploit Prevention
      - f leave
      - factions leave
      - f disband
      - factions disband
      - f kick
      - factions kick

  # How often to update the combat action bar (ticks)
  actionbar-update-interval-ticks: 2

  # Combat action bar templates (MiniMessage). {seconds} and {health} are
  # pre-colored (countdown is always green, health is always red) --
  # everything else in the template is yours to style freely.
  # Placeholders:
  #   {seconds}    remaining combat time, e.g. "(12s)"
  #   {health}     opponent's health, e.g. "❤ 14"
  #   {opponent}   opponent's name
  #   {your_cps}   your clicks per second
  #   {their_cps}  opponent's clicks per second
  actionbar:
    # Tagged against "the server" (no live opponent -- e.g. after a combat logout)
    vs-server: '<gray>Combat<gray>: <red>server <gray>{seconds} <green>you <white>({your_cps}cps)'
    # Tagged against another online player
    vs-player: '<red>⚔ <gray>Combat<gray>: <red>{opponent} <gray>(<green>{health}<gray>) <gray>Ends: <green>{seconds} <gray>CPS: <green>You: <gray>(<green>{your_cps}<gray>) <red>Them <gray>(<red>{their_cps}<gray>) <red>⚔'    # Tagged, but the opponent is offline or otherwise unresolvable
    vs-unknown: '<red><bold>Combat</bold><gray>: {seconds} <green>you <white>({your_cps}cps)'

  # ---- LEGACY COMBAT (1.8 PvP style) ----
  legacy-combat:
    enabled: true
    # Worlds to apply legacy combat (leave empty for all worlds)
    worlds: []
    # Attack speed (higher = faster attacks, removes cooldown bar)
    attack-speed: 1024.0
    # Remove sweeping damage from axes
    disable-sweeping-attacks: true

    # --- WEAPONS & ARMOR ---
    # Overrides a weapon's base attack damage with the value below instead
    # of the modern attribute-based amount. A material left out of the
    # table keeps its normal damage. Enchantments/potion effects/armor
    # still apply normally on top of this.
    legacy-weapon-damage: true
    weapon-damage:
      WOODEN_SWORD: 4.0
      GOLDEN_SWORD: 4.0
      STONE_SWORD: 5.0
      IRON_SWORD: 6.0
      DIAMOND_SWORD: 8.0
      NETHERITE_SWORD: 8.0
      WOODEN_AXE: 5.0
      GOLDEN_AXE: 5.0
      STONE_AXE: 6.0
      IRON_AXE: 6.0
      DIAMOND_AXE: 6.0
      NETHERITE_AXE: 6.0
    # Cancels out the armor toughness modern armor pieces carry (the
    # mechanic that gives diminishing returns against big hits), so armor
    # reduction goes back to being a flat, predictable percentage.
    legacy-armor-calculations: true
    # Blocks swapping any item into the offhand slot (F key) -- no
    # dual-wielding, no shields.
    disable-offhand: true

    # --- KNOCKBACK & PROJECTILES ---
    # Restores the pre-1.9 behavior of snowball/egg/fishing-rod hits
    # pushing the target even though they deal no damage.
    projectile-knockback:
      fishing-rod: true
      snowball: true
      egg: true
    # Knockback applied on every melee hit and every enabled projectile hit
    # above, overriding vanilla's own knockback entirely.
    knockback:
      horizontal: 0.275
      vertical: 0.15
      # Extra horizontal knockback when the attacker is sprinting.
      sprint-bonus: 0.1

    # --- HEALTH & REGEN ---
    # Replaces vanilla's fast, food-saturation-boosted regen with a flat
    # 1 heart every 4 seconds (still gated on food level >= 18, same as
    # vanilla's own natural-regen requirement).
    legacy-health-regen: true
    # Replaces vanilla's golden apple/enchanted golden apple effects
    # entirely with these lists (each entry: type, amplifier, duration in
    # seconds). Leave a list empty to fall back to doing nothing special
    # for that apple (vanilla's own effects still apply in that case).
    legacy-golden-apples: true
    golden-apple-effects:
      - type: REGENERATION
        amplifier: 1
        duration-seconds: 5
      - type: ABSORPTION
        amplifier: 0
        duration-seconds: 120
    enchanted-golden-apple-effects:
      - type: REGENERATION
        amplifier: 1
        duration-seconds: 20
      - type: ABSORPTION
        amplifier: 3
        duration-seconds: 120
      - type: FIRE_RESISTANCE
        amplifier: 0
        duration-seconds: 300
      - type: RESISTANCE
        amplifier: 0
        duration-seconds: 300

# ============================================
# FACTIONS
# ============================================
factions:
  # Prevent faction leaders from using /f leave
  prevent-leader-leave: true

  # Command aliases for /factions
  command-aliases:
    - f
    - factions
    - t

# ============================================
# KITS
# ============================================
kits:
  # Default kit cooldown in seconds
  default-cooldown-seconds: 30
  # Delay before class effects apply after putting on full armor
  effect-warmup-seconds: 5
  # Maximum cooldown allowed (about 1 day)
  max-cooldown-seconds: 86400
  # Maximum money cost for a kit
  max-money-cost: 1000000000.0
  # Maximum item cost amount
  max-cost-item-amount: 64

# ============================================
# ABILITIES
# ============================================
abilities:
  # Cooldown shared across all ability items
  global-cooldown-seconds: 4
  # Maximum number of items /getitem can give
  max-getitem-amount: 64
  # Portable Bard's buff items only reach faction members within this many
  # blocks of the caster (same world), not the whole online faction.
  bard-share-radius-blocks: 30
  # Regions where abilities are disabled (e.g., spawn, safezone)
  # Per-ability settings (cooldowns, durations) go in abilities.yml
  disabled-regions:
    - spawn
  # Faction claim names abilities are disabled in -- abilities work
  # everywhere else (wilderness and any other faction's claimed land),
  # this is only a blocklist. Matches the faction's tag/name
  # case-insensitively, including the system SafeZone/WarZone factions
  # (set via /f safezone, /f warzone) if you've named them this way.
  disabled-claim-names:
    - safezone

# ============================================
# NAMETAGS
# ============================================
nametags:
  # Enable/disable nametags above player heads
  enabled: true

  # How often to update nametags (in ticks; 20 ticks = 1 second)
  update-interval-ticks: 15

  # Nametag format is fixed: &8[&a<ftop>&8] &8[<color>faction&8] &e<player>
  # Note: nametags use a shared scoreboard team, so the faction-name color
  # below is the SAME for every viewer -- Minecraft's scoreboard API has no
  # per-viewer color, so true "red to enemies, purple to allies" coloring
  # would require a packet library (e.g. ProtocolLib) and isn't implemented.
  colors:
    same-faction: 'green'      # Players in a faction
    enemy: 'red'
    ally: 'purple'
    neutral: 'gray'            # Factionless players

# ============================================
# REBOOT SYSTEM
# ============================================
reboot:
  # Default countdown length for /reboot
  default-delay-minutes: 10

  # When to announce reminders before shutdown
  reminder-minutes:
    - 10
    - 5
    - 1

  # ---- ARCHER CLASS ----
  # Archers mark victims with arrows. Each stack increases arrow damage and gives
  # the archer's faction a melee bonus against the marked player.
  archer-tag:
    # How long a mark lasts (refreshed by each new arrow)
    duration-seconds: 8
    # Maximum number of stacks from multiple archers
    max-stacks: 3
    # Arrow damage multiplier per stack (0.10 = +10% per stack)
    arrow-damage-bonus-per-stack: 0.02175
    # Melee damage bonus for the archer's faction only
    faction-melee-bonus-per-stack: 0.025
    # Chat messages when a mark is applied (MiniMessage). Placeholders:
    # {player}, {percent} (arrow bonus), {melee} (faction melee bonus),
    # {seconds} (mark duration).
    message-attacker: '&c&lKITS&r &7> <gold>Tagged {player} <gray>(+{percent}%, {seconds}s)'
    message-victim: '&c&lKITS&r &7> <red>Tagged by {player} <gray>(+{percent}%, {seconds}s)'
