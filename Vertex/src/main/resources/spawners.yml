# ============================================
# SPAWNER STACKING
# ============================================
# Maximum number of spawners a single stack can hold.
max-stack-size: 50

# Whether breaking a spawner requires a Silk Touch pickaxe.
silk-touch-required: false

# What breaking a stacked spawner does:
#   drop-all   - drops every spawner in the stack as items, removes the block
#   decrement  - drops just 1 spawner, the block stays if any are left
break-mode: drop-all

# Percentage of the shop price refunded when withdrawing spawners from a
# stack via the management GUI (right-click a spawner with an empty hand).
sell-refund-percent: 35

# --- VANILLA SPAWNER TUNING ---
# These scale a stack's own CreatureSpawner block-entity fields by its
# stack size, so a bigger stack actually produces more mobs per cycle
# instead of just being a number tracked in a database somewhere.
spawn-count-per-stack: 1
max-spawn-count: 8
max-nearby-entities-per-stack: 2
max-nearby-entities-cap: 32
min-spawn-delay-ticks: 150
max-spawn-delay-ticks: 300
required-player-range-blocks: 32
spawn-range-blocks: 4

# Hostile mobs normally reject vanilla's bright-light spawn rule. When true,
# Vertex gives sunlit player spawners the same capped/manual fallback used by
# Iron Golem spawners, so they keep producing during the day. Covered/dark
# spawners continue using vanilla's normal spawn cycle.
spawn-in-daylight: true

# A floorless grinder is intentional: its mobs should appear in the clear air
# around the cage and fall into the collection/killing area. When no valid
# vanilla floor-based spawn position exists within spawn-range-blocks, Vertex
# uses its capped/manual fallback instead of requiring a platform.
spawn-in-air: true

# Vertex has the final say over spawns from its own spawners. If another
# plugin -- a mob limiter, a rival stacker, a region protector -- cancels a
# spawn from a spawner Vertex tracks, Vertex puts it back. Without this a
# player's paid-for spawner can sit silently dead with nothing to point at.
#
# Only spawns from Vertex-tracked spawners are ever reinstated; other
# plugins' spawners are left entirely alone, as is Vertex's own mob-stacking
# merge (that cancel is how a merge happens, so undoing it would duplicate
# the mob). Turn this off if another plugin must be able to veto Vertex
# spawners.
override-other-plugins: true

# --- SHOP CATALOG & DROP TABLES ---
