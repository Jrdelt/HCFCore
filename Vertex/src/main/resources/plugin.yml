name: HCFCore
main: me.hcfcore.core.HCFCorePlugin
version: ${project.version}
api-version: '1.21.10'
author: cesardeltorojr
description: Kits, sidebar scoreboard, and PvP combat-tag timers, integrated with FactionsUUID.

depend:
  - FactionsUUID

softdepend:
  - Vault
  - WorldGuard
  - LuckPerms

commands:
  kit:
    description: Apply or manage kits.
    usage: /<command> <name>
  kits:
    description: Browse kits in a GUI -- left-click to claim, right-click to preview.
    usage: /<command>
  hcfcore:
    description: HCFCore admin/reload command.
    usage: /<command> reload
  uncombat:
    description: Clear a player's combat tag.
    usage: /<command> <player>
  combatcheck:
    description: Check a player's combat status.
    usage: /<command> <player>
  combattag:
    description: Force a player into combat, for testing.
    usage: /<command> <player> [opponent|server]
  getitem:
    description: Give a player an ability item, ignoring cooldowns.
    usage: /<command> <username> <ability> [amount]
  abilities:
    description: Browse abilities in a GUI.
    usage: /<command>
  language:
    description: View or change your language.
    usage: /<command> [code]
  reboot:
    description: Start or cancel a server reboot countdown.
    usage: /<command> [cancel]
  nextreboot:
    description: Show the next scheduled server reboot.
    usage: /<command>

permissions:
  hcfcore.admin:
    description: Reload HCFCore's config.
    default: op
  hcfcore.kit.create:
    description: Create a kit from the currently held inventory.
    default: op
  hcfcore.kit.save:
    description: Legacy alias permission for creating kits.
    default: op
  hcfcore.kit.delete:
    description: Delete a kit.
    default: op
  hcfcore.kit.bypasscooldown:
    description: Bypass kit cooldowns.
    default: op
  hcfcore.kit.bypasscost:
    description: Bypass kit costs (money and item).
    default: op
  hcfcore.combat.uncombat:
    description: Clear another player's combat tag.
    default: op
  hcfcore.combat.check:
    description: Check another player's combat status.
    default: op
  hcfcore.combat.tag:
    description: Force a player into combat, for testing.
    default: op
  hcfcore.ability.give:
    description: Give ability items via /getitem or the /abilities GUI.
    default: op
  hcfcore.reboot.start:
    description: Start or cancel a server reboot countdown.
    default: op
