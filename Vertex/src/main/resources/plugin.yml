name: Vertex
main: me.vertex.core.VertexPlugin
version: ${project.version}
api-version: '1.21.10'
author: cesardeltorojr
description: Vertex's native factions, kits, PvP, economy, events, and progression suite.

softdepend:
  - Vault
  - WorldGuard
  - LuckPerms
  - PlaceholderAPI
  - Essentials
  - FastAsyncWorldEdit
  - DecentHolograms
  - FancyNpcs

commands:
  f:
    description: Create and manage your native Vertex faction.
    usage: /<command> [create|claim|home|perms|bank|tnt|upgrades|who]
    aliases: [factions, faction, t]
  fa:
    description: Native Vertex faction administration commands.
    usage: /<command> help [page]
    aliases: [fadmin]
  spawn:
    description: Teleport to the shared network Spawn after a safe countdown.
    usage: /<command> [set]
  warp:
    description: Teleport to a public network warp.
    usage: /<command> <name>
  warps:
    description: Browse all public network warps.
    usage: /<command>
  s:
    description: Configure shared server locations.
    usage: /<command> warp set|delete <name> [description]
  rtp:
    description: Browse safe random-teleport destinations.
    usage: /<command>
    aliases: [wild]
  fpowerbooster:
    description: Give persistent personal faction-power booster vouchers.
    usage: /<command> give <player> <10|25|50|75|100> [amount]
  kit:
    description: Claim, preview, or manage kits.
    usage: /<command> <name>|preview <name>
  kits:
    description: Browse kits in a GUI -- left-click to claim, right-click to preview.
    usage: /<command>
  vertex:
    description: Vertex admin/reload command.
    usage: /<command> reload|clearmobstacks|storage|spawnerinfo|spawnerdebug|performance
  uncombat:
    description: Clear a player's combat tag.
    usage: /<command> <player>
  combatcheck:
    description: Check a player's combat status.
    usage: /<command> <player>
  combattag:
    description: Force a player into combat, for testing.
    usage: /<command> <player> [opponent|server]
  getitem:
    description: Give a player an ability item, ignoring cooldowns.
    usage: /<command> <username> <ability> [amount]
  abilities:
    description: Browse abilities in a GUI.
    usage: /<command>
  chunkcollector:
    description: Give a player a Chunk Collector (Green Shulker Box).
    usage: /<command> give <player>
  chunkbusters:
    description: Give configured Chunk Buster items.
    usage: /<command> give <player> <upward|downward|full|single-column> [amount]
    aliases: [chunkbuster]
  blueprint:
    description: Give Blueprint items or manage Blueprint placement cooldowns.
    usage: /<command> give <player> <template>|cooldown remove <player>
  language:
    description: View or change your language.
    usage: /<command> [code]
  cooldowns:
    description: View your active kit and ability cooldowns.
    usage: /<command>
  tags:
    description: Browse and select server tags.
    usage: /<command>
  settings:
    description: Configure your personal optional server announcements.
    usage: /<command>
    aliases: [preferences]
  reboot:
    description: Start or cancel a server reboot countdown.
    usage: /<command> [minutes|cancel]
  nextreboot:
    description: Show the next scheduled server reboot.
    usage: /<command>
  rollback:
    description: View and restore items from a player's death history.
    usage: /<command> <player>
  frally:
    description: Set or clear faction rally point (4 minute duration).
    usage: /<command> [set|clear]
  staff:
    description: Toggle full staff mode (vanish + staff-build).
    usage: /<command>
  vanish:
    description: Toggle vanish, hiding you from non-staff players.
    usage: /<command>
  staffchat:
    description: Toggle staff-only chat mode.
    usage: /<command>
  staffbuild:
    description: Toggle build/break bypass in claimed land.
    usage: /<command>
  freeze:
    description: Freeze or unfreeze a player in place.
    usage: /<command> <player>
  invsee:
    description: View a player's live inventory.
    usage: /<command> <player>
  endersee:
    description: View a player's live ender chest.
    usage: /<command> <player>
  backpack:
    description: Give a player a Backpack.
    usage: /<command> give <player> <tier> [level 1-10]
  filter:
    description: Configure which auto-collected Backpack items are discarded.
    usage: /<command> add|remove <material>|list|clear
  sell:
    description: Sell eligible vanilla items through the Vertex dynamic shop.
    usage: /<command> hand|all
  koth:
    description: Focus an active KOTH or manage KOTH regions as staff.
    usage: /<command> focus [name|off]|create|wand|cancel|start|stop|delete|list|validate
  cf:
    description: Browse, host, or play a coinflip.
    usage: /<command> [amount [exp|xp|money|gc] [player]|hand [player]|review <id>|approve <id>|deny <id>|ban|unban|cancel <id>|logs [player]]
    aliases: [coinflip]
  boosters:
    description: View the bonuses currently applying to you.
    usage: /<command> [inspect <player>]
  shop:
    description: Browse categorized items, or buy/sell at their current market price.
    usage: /<command> [buy|sell <item> [amount]]
  ah:
    description: Browse, list, or manage Auction House listings.
    usage: /<command> [sell <price>|cancel <id>|collect|logs [player]]
    aliases: [auctionhouse]
  outpost:
    description: Focus an active Outpost or manage Outpost regions as staff.
    usage: /<command> focus [name|off]|create|wand|cancel|start|stop|delete|list|validate
  trade:
    description: Request, accept, or cancel a secure player trade.
    usage: /<command> <player>|accept <player>|cancel
  tradetoggle:
    description: Toggle whether you accept incoming trade requests.
    usage: /<command>
  tradehistory:
    description: View player trade history as staff.
    usage: /<command> [player]
  tradelogs:
    description: View all or one player's trade history as staff.
    usage: /<command> [all|player]
  sandbot:
    description: Give a Sand Bot item, or stop an active Sand Bot.
    usage: /<command> give <player>|stop [player]
  mines:
    description: View the mining worlds, or place their regions as staff.
    usage: /<command> [wand <mine>|cancel|list]
  events:
    description: View live Mine KOTH and Hot Zone events.
    usage: /<command>
  wand:
    description: Give Sell Wands and TNT Wands.
    usage: /<command> give <player> <tier> [uses]
  tntfill:
    description: Fill dispensers in your claim with TNT from your faction's TNT bank or your own inventory.
    usage: /<command> <radius> <amount> bank|inventory
  ftopforcecheck:
    description: Immediately recalculate Vertex F Top without changing its automatic schedule.
    usage: /<command>
  pvptop:
    description: Show factions ranked by PvP objective points.
    usage: /<command>
  gc:
    description: Open your GC wallet, redeem a code, or manage GC as staff.
    usage: /<command> [withdraw <amount>|redeem <code>|redeem create <amount> [uses] [expires-in]|admin balance|give|remove|set|zero|logs <player> [amount]]
  dupe:
    description: Staff-only suspected-duplicate item case inspection and resolution.
    usage: /<command> inspect list [page]|inspect <id>|resolve <id> [reason]|dismiss <id> [reason]|confirm <id> [reason]
  enchant:
    description: Browse the Custom Enchant Rune shop or give Runes/Lucky Gems.
    usage: /<command>|give <player> rune <tier> [amount]|give <player> gem [amount]
    aliases: [ce, customenchants, runes]
  haven:
    description: Enter Haven or manage Haven zones as staff.
    usage: /<command> [create|wand|list|lootpool|portal create|spawnpoints|koth|outpost]
  riftlands:
    description: Enter Riftlands or manage Riftlands zones as staff.
    usage: /<command> [create|wand|list|lootpool|portal create|spawnpoints|koth|outpost]
    aliases: [rift]

permissions:
  vertex.fa.*:
    description: Access every Vertex faction administration command.
    default: op
    children:
      vertex.fa.help: true
      vertex.fa.info: true
      vertex.fa.grace: true
      vertex.fa.power: true
      vertex.fa.claim: true
      vertex.fa.unclaim: true
      vertex.fa.disband: true
      vertex.fa.relation: true
      vertex.fa.shield: true
      vertex.fa.bank: true
      vertex.fa.vault: true
      vertex.fa.upgrades: true
      vertex.fa.members: true
      vertex.fa.combat: true
      vertex.fa.logs: true
      vertex.fa.network: true
      vertex.fa.season: true
  vertex.fa.help: {default: op}
  vertex.fa.info: {default: op}
  vertex.fa.grace: {default: op}
  vertex.fa.power: {default: op}
  vertex.fa.claim: {default: op}
  vertex.fa.unclaim: {default: op}
  vertex.fa.disband: {default: op}
  vertex.fa.relation: {default: op}
  vertex.fa.shield: {default: op}
  vertex.fa.bank: {default: op}
  vertex.fa.vault:
    description: Inspect a faction vault while retaining the network-wide edit lock.
    default: op
  vertex.fa.upgrades:
    description: Set faction upgrade levels without charging normal costs.
    default: op
  vertex.fa.members: {default: op}
  vertex.fa.combat: {default: op}
  vertex.fa.logs: {default: op}
  vertex.fa.network:
    description: Inspect and recover network shards and transfers.
    default: op
  vertex.fa.season:
    description: Perform the destructive, network-wide seasonal data reset.
    default: op
  vertex.network.recovery:
    description: Approve crash recovery and return a shard to public service.
    default: op
  vertex.network.transfer.alerts:
    description: Receive alerts for unresolved cross-shard handoffs.
    default: op
  vertex.teleport.bypass:
    description: Bypass persistent Vertex teleport cooldowns.
    default: op
  vertex.teleport.combat-bypass:
    description: Use Vertex teleports while combat tagged.
    default: op
  vertex.spawn.set:
    description: Set the persistent network Spawn location.
    default: op
  vertex.server.warp:
    description: Create and delete public network warps with /s.
    default: op
  vertex.factions.admin:
    description: Create or remove native SafeZone/WarZone system claims.
    default: op
  vertex.factions.bypass:
    description: Bypass native Vertex faction build and container protection.
    default: op
  vertex.fpowerbooster.give:
    description: Give persistent F Power Booster vouchers.
    default: op
  vertex.admin:
    description: Reload Vertex's config, clear stacked mobs, or switch the storage backend.
    default: op
  vertex.ftop.forcecheck:
    description: Immediately recalculate Vertex F Top for every faction.
    default: op
  vertex.baseclaim.view:
    description: View a faction's Base Claim info via /f baseclaim.
    default: true
  vertex.baseclaim.create:
    description: Create a new Base Claim anchor via /f baseclaim.
    default: true
  vertex.baseclaim.remove:
    description: Remove an existing Base Claim via /f baseclaim.
    default: true
  vertex.chunkbuster.give:
    description: Give configured Chunk Buster items with /chunkbusters give.
    default: op
  vertex.shield.activate:
    description: Activate a faction Shield as its Leader or Co-Leader.
    default: true
  vertex.collector.give:
    description: Give a player a Chunk Collector.
    default: op
  vertex.collector.bypass:
    description: Bypass faction ownership and role checks for Chunk Collectors. Use is intentionally separate from staff-build.
    default: op
  vertex.blueprint.give:
    description: Give a player a Blueprint.
    default: op
  vertex.blueprint.cooldown.remove:
    description: Remove an online or offline player's Blueprint placement cooldown.
    default: op
  vertex.backpack.give:
    description: Give a player a Backpack.
    default: op
  vertex.backpack.debug:
    description: Toggle personal Backpack interaction diagnostics.
    default: op
  vertex.coinflip.remove:
    description: Cancel any player's active coinflip and refund its wager.
    default: op
  vertex.coinflip.logs:
    description: View the Coinflip staff audit log.
    default: op
  vertex.coinflip.payouts:
    description: Inspect and reconcile uncertain Coinflip currency payouts.
    default: op
  vertex.coinflip.intents:
    description: Inspect and reconcile interrupted Coinflip wager debits.
    default: op
  vertex.auction.remove:
    description: Cancel any player's active Auction House listing and refund it.
    default: op
  vertex.auction.logs:
    description: View the Auction House staff audit log.
    default: op
  vertex.auction.payouts:
    description: Inspect and reconcile uncertain Auction House currency payouts.
    default: op
  vertex.auction.intents:
    description: Inspect and reconcile interrupted Auction House listing debits.
    default: op
  vertex.transaction.audit:
    description: Receive staff alerts for large GC transactions.
    default: op
  vertex.transaction.audit.ip:
    description: View player IP addresses in large GC transaction alerts.
    default: op
  vertex.trade.use:
    description: Request and accept player trades.
    default: true
  vertex.trade.staff.bypassdistance:
    description: Bypass the player-trade distance check.
    default: op
  vertex.trade.staff.bypassblacklist:
    description: Bypass player-trade item, world, and gamemode restrictions.
    default: op
  vertex.trade.staff.history:
    description: View the player-trade audit log.
    default: op
  vertex.trade.payouts:
    description: Inspect and reconcile uncertain legacy Trade money/EXP payouts.
    default: op
  vertex.trade.staff.alerts:
    description: Receive suspicious player-trade alerts.
    default: op
  vertex.koth.admin:
    description: Create, edit, start, stop, and delete KOTH events.
    default: op
  vertex.outpost.admin:
    description: Create, edit, start, stop, and delete Outpost events.
    default: op
  vertex.kit.create:
    description: Create a kit from the currently held inventory.
    default: op
  vertex.kit.save:
    description: Legacy alias permission for creating kits.
    default: op
  vertex.kit.delete:
    description: Delete a kit.
    default: op
  vertex.kit.bypasscooldown:
    description: Bypass kit cooldowns.
    default: op
  vertex.kit.bypasscost:
    description: Bypass kit costs (money and item).
    default: op
  vertex.combat.uncombat:
    description: Clear another player's combat tag.
    default: op
  vertex.combat.check:
    description: Check another player's combat status.
    default: op
  vertex.combat.tag:
    description: Force a player into combat, for testing.
    default: op
  vertex.ability.give:
    description: Give ability items via /getitem or the /abilities GUI.
    default: op
  vertex.reboot.start:
    description: Start or cancel a server reboot countdown.
    default: op
  vertex.staff.rollback:
    description: View and restore items from a player's death history.
    default: op
  vertex.staff.punish.bypasscombat:
    description: Kick or ban a combat-tagged player anyway. Every use is logged.
    default: op
  vertex.mines.admin:
    description: Place and manage mining world regions.
    default: op
  vertex.wand.give:
    description: Give a player a Sell Wand or TNT Wand.
    default: op
  vertex.boosters.inspect:
    description: View another player's booster breakdown with /boosters inspect.
    default: op
  vertex.staff.mode:
    description: Toggle full staff mode (vanish + staff-build).
    default: op
  vertex.staff.vanish:
    description: Toggle vanish, and see other vanished staff.
    default: op
  vertex.staff.staffchat:
    description: Toggle staff chat, and read staff chat messages.
    default: op
  vertex.staff.staffbuild:
    description: Bypass claim protection to build/break/interact anywhere.
    default: op
  vertex.staff.freeze:
    description: Freeze/unfreeze a player, and see freeze-related alerts.
    default: op
  vertex.staff.invsee:
    description: View a player's live inventory.
    default: op
  vertex.staff.endersee:
    description: View a player's live ender chest.
    default: op
  vertex.sandbot.give:
    description: Give a player a Sand Bot item.
    default: op
  vertex.sandbot.admin:
    description: Stop another player's active Sand Bot.
    default: op
  vertex.sandbot.debug:
    description: View personal Sand Bot diagnostics.
    default: op
  vertex.combat.safezone.bypass:
    description: Move into a protected zone while combat-tagged.
    default: op
  vertex.tntfill.use:
    description: Fill dispensers in your claim with TNT from your faction bank or inventory.
    default: true
  vertex.gc.use:
    description: Open the GC wallet and redeem codes.
    default: true
  vertex.gc.view:
    description: View another player's GC balance (/gc admin balance).
    default: op
  vertex.gc.logs:
    description: View the GC staff audit log (/gc admin logs).
    default: op
  vertex.gc.adjust:
    description: Give, remove, set, or zero a player's GC balance. Every use is logged.
    default: op
  vertex.gc.redeem.create:
    description: Generate a GC redeem code (/gc redeem create).
    default: op
  vertex.dupe.inspect:
    description: List and view suspected-duplicate item cases (/dupe inspect).
    default: op
  vertex.dupe.resolve:
    description: Resolve, dismiss, or confirm a suspected-duplicate item case. Every attempt is logged.
    default: op
  vertex.dupe.alert:
    description: Receive live staff alerts and a join-time summary when a suspected duplicate is detected.
    default: op
  vertex.enchant.give:
    description: Give a player a Rune or a Lucky Gem.
    default: op
  vertex.zones.use:
    description: Enter Haven and Riftlands, view their loot pools, and use Riftlands Tickets.
    default: true
  vertex.zones.admin:
    description: Create/delete Haven and Riftlands regions/routes, edit loot, and use zone debug commands.
    default: op
  vertex.zones.admin.build:
    description: Bypass the no-build terrain rule inside Haven and Riftlands.
    default: op
  vertex.zones.command-bypass:
    description: Bypass commands disabled inside Haven and Riftlands.
    default: op
  vertex.portals.use:
    description: Enter configured physical portals.
    default: true
  vertex.portals.admin:
    description: Create, delete, inspect, and preview physical entry portals and arrival routes.
    default: op
