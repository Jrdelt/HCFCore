# ============================================
# SHOP
# ============================================
# /shop -- a categorized market. Every item below has a dynamic price:
# buying pushes it up, selling pushes it down, and it drifts back toward
# its base price over time on its own. /shop opens a one-row category
# picker; clicking a category opens its own paginated browse/trade GUI.
enabled: true

# How strongly one unit bought/sold moves the price -- the buy price is
# base-price * (1 + price-change-per-unit) ^ net-volume, where net-volume
# is "units bought minus units sold" since it last fully recovered.
price-change-per-unit: 0.001

# The first this-many units of net volume (in either direction) don't move
# the price at all -- only volume beyond this threshold counts. A handful
# of trades leaves the price untouched; it only actually starts moving once
# a real amount has been bought or sold.
price-change-threshold-units: 50

# The price can never drift further than this from an item's base-price,
# in either direction (0.25 = as low as 25% of base, 4.0 = as high as 400%).
min-price-multiplier: 0.25
max-price-multiplier: 4.0

# Selling always pays this fraction of the *current* buy price -- not the
# base price -- so the spread follows the market instead of staying fixed.
sell-price-ratio: 0.75

# Every item's price drifts back toward its base price on its own: every
# decay-interval-ticks, its net-volume shrinks by this fraction (0.05 = 5%
# closer to equilibrium each tick of recovery).
decay-interval-ticks: 6000
decay-fraction: 0.05

# Left-click buys this many, shift-left-click buys a full stack. Same for
# selling on the right-click side.
default-buy-amount: 1

# Each top-level key is one category shown in the /shop picker (max 9 --
# it's a single row). display-name and icon are yours to change; items is
# a map of Material -> base-price, same as before. A material must only
# appear once across every category -- a duplicate is ignored (with a
# startup warning) rather than silently overwriting the first one.
