# ============================================
# GC (GIFT CARD / CREDIT)
# ============================================
# GC is a third currency alongside money and experience. It is 100%
# self-hosted -- Vertex's own database (the gc_* tables) is the sole
# balance authority. It never reads from or defers to Tebex,
# PlaceholderAPI, or any other external plugin. A new player's GC balance
# is 0; nothing seeds it.
#
# GC is a persistent wallet: unlike Coinflip/Auction House state, it is
# never touched by a season reset.

# Bounds for player-created single-use codes via /gc withdraw <amount>.
# GC does not convert to or from Vault money.
min-withdraw: 1
max-withdraw: 1000000000

# Staff-generated redeem codes (/gc redeem create <amount> [uses]).
# Default: single-use, 12 characters, no expiry unless staff sets one at
# creation time.
redeem-code-length: 12
redeem-code-charset: "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"

# Optional, config-gated console command fired whenever a player's own
# action credits their GC balance (for example, a redeemed code) -- for
# example to notify a future Tebex webstore integration or a Discord
# webhook. Tokens: {player}, {amount}, {reason} (for example, "redeem").
# Blank (the default) means this never fires; GC's ledger is fully
# internal regardless of whether this is configured.
interop-command: ""

# Player-facing transaction log (/gc's Logs button) and the staff-only
# /gc admin logs command both page results this many rows at a time.
log-page-size: 8
